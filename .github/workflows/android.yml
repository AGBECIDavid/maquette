# Construit l'APK Android d'Epitech Tracker.
#
#   - À chaque poussée sur main : un APK en artefact, pour tester soi-même.
#   - Sur un tag v* (ex. v0.5.0) : une Release GitHub avec l'APK attaché —
#     c'est ce lien-là qu'on donne aux bêta-testeurs.
#
# La construction est conditionnée aux tests, comme pour le site.
#
# SIGNATURE. Android refuse de mettre à jour une application signée par une
# autre clé : il faut désinstaller, et désinstaller efface le cursus. La clé
# doit donc être la même pour toutes les versions distribuées. Elle vit dans
# les secrets du dépôt (voir epitech-tracker/ANDROID.md), jamais dans le code.
#
# Sans ces secrets, on produit un APK de test signé par une clé jetable —
# utile pour soi, dangereux à distribuer. Une publication sur tag REFUSE donc
# de partir sans la clé stable.

name: Construire l'APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # nécessaire pour attacher l'APK à une Release
    defaults:
      run:
        working-directory: epitech-tracker
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - name: Refuser une publication sans clé de signature stable
        if: env.IS_RELEASE == 'true' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Publication refusée : le secret ANDROID_KEYSTORE_BASE64 est absent."
          echo "::error::Un APK signé par une clé jetable forcerait les testeurs à désinstaller à la mise à jour suivante, donc à perdre leurs données."
          echo "::error::Voir epitech-tracker/ANDROID.md, section « Clé de signature »."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: epitech-tracker/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Construction du site
        run: npm run build

      - name: Copie dans le projet Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Clé de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK signé
        if: env.HAS_KEYSTORE == 'true'
        working-directory: epitech-tracker/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.version.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/epitech-tracker-${{ steps.version.outputs.name }}.apk"

      - name: APK de test (clé jetable)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: epitech-tracker/android
        run: |
          echo "::warning::Pas de clé de signature stable : APK de TEST uniquement. Ne pas distribuer — voir ANDROID.md."
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.version.outputs.name }}-test
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$GITHUB_WORKSPACE/epitech-tracker-${{ steps.version.outputs.name }}-TEST.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: epitech-tracker-apk
          path: epitech-tracker-*.apk
          if-no-files-found: error

      - name: Publier la version
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: epitech-tracker-*.apk
          name: Epitech Tracker ${{ steps.version.outputs.name }}
          body: |
            Version ${{ steps.version.outputs.name }} (bêta).

            **Android** : télécharge le fichier `.apk` ci-dessous, ouvre-le, autorise
            l'installation depuis cette source si le téléphone le demande.

            **iPhone** : pas d'APK sur iOS. Ouvre https://epitech-tracker.vercel.app
            dans Safari → Partager → « Sur l'écran d'accueil ».

            Les données restent sur ton téléphone. Désinstaller l'application
            efface ton cursus : exporte-le avant (Paramètres → Exporter).
