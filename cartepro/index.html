<style>
/* ============================================================================
   CartePro — démonstrateur fonctionnel
   Ministère du Job et Bonheur / Direction du Numérique et de l'Innovation
   Réf. JEB/DNI/2026-002

   Parti pris visuel : la page est un service public en plein jour. Elle assume
   un seul thème, entièrement peint, plutôt qu'une inversion approximative.
   ========================================================================= */

:root {
  --ink:        #12172b;
  --ink-2:      #3d4460;
  --ink-3:      #6b7291;
  --ink-4:      #969cb4;

  --paper:      #eef0f6;   /* plan de travail */
  --surface:    #ffffff;
  --surface-2:  #f7f8fc;
  --surface-3:  #eceef6;

  --line:       #e0e3ee;
  --line-2:     #cbd0e0;

  --brand:      #000091;   /* bleu France */
  --brand-2:    #1a1aa8;
  --brand-wash: #ebebf8;
  --marianne:   #e1000f;

  --data:       #2a78d6;   /* encre des graphiques */
  --data-wash:  #e7f0fc;
  --data-200:   #9ec5f4;
  --data-600:   #184f95;

  --good:       #0ca30c;
  --good-wash:  #e6f6e6;
  --warn:       #fab219;
  --warn-wash:  #fdf3e0;
  --serious:    #ec835a;
  --critical:   #d03b3b;
  --crit-wash:  #fbeaea;

  --r-card: 10px;
  --r-ctl: 7px;
  --shadow-1: 0 1px 2px rgba(18,23,43,.07);
  --shadow-2: 0 1px 2px rgba(18,23,43,.06), 0 10px 28px -16px rgba(18,23,43,.35);
  --shadow-3: 0 2px 6px rgba(18,23,43,.08), 0 28px 60px -24px rgba(18,23,43,.45);

  --ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --rail-w: 236px;
  --dock-h: 52px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: var(--dock-h);
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }

.mono { font-family: var(--mono); font-variant-ligatures: none; }
.num  { font-variant-numeric: tabular-nums; }
.vh {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* ── Bandeau institutionnel ─────────────────────────────────────────────── */

.tricolore { display: flex; height: 3px; }
.tricolore i { flex: 1; }
.tricolore i:nth-child(1) { background: var(--brand); }
.tricolore i:nth-child(2) { background: #ffffff; }
.tricolore i:nth-child(3) { background: var(--marianne); }

.masthead {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.masthead__in {
  display: flex; align-items: center; gap: 24px;
  padding: 12px 22px;
  max-width: 1560px; margin: 0 auto;
}
.crest { display: flex; align-items: center; gap: 14px; min-width: 0; }
.crest__mark {
  width: 40px; height: 40px; flex: none; border-radius: 3px;
  background: var(--brand); color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: 15px; letter-spacing: -.03em;
}
.crest__txt { min-width: 0; }
.crest__ministry {
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); line-height: 1.35;
}
.crest__dir { font-size: 11px; color: var(--ink-4); line-height: 1.35; }

.wordmark {
  display: flex; align-items: baseline; gap: 8px;
  padding-left: 24px; border-left: 1px solid var(--line);
}
.wordmark b { font-size: 19px; font-weight: 700; letter-spacing: -.025em; }
.wordmark span { font-size: 11px; color: var(--ink-4); }

.masthead__spacer { flex: 1; }

.envpill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px; border-radius: 100px;
  background: var(--warn-wash); border: 1px solid #f0dcb4;
  font-size: 11px; font-weight: 600; color: #7a5502; white-space: nowrap;
}
.envpill::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn); flex: none;
}

.whoami { display: flex; align-items: center; gap: 10px; }
.whoami__av {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; color: #fff; background: var(--ink-2);
}
.whoami__n { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.whoami__r { font-size: 11px; color: var(--ink-4); line-height: 1.25; }

/* ── Ossature ───────────────────────────────────────────────────────────── */

.workspace {
  display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr);
  max-width: 1560px; margin: 0 auto; min-height: calc(100vh - 120px);
}
.rail {
  border-right: 1px solid var(--line);
  padding: 20px 14px 40px;
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
}
.rail__label {
  font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase;
  color: var(--ink-4); padding: 0 10px; margin: 0 0 10px;
}
.rail__group + .rail__group { margin-top: 26px; }
.navitem {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 9px 10px; margin-bottom: 2px;
  border: 0; border-radius: var(--r-ctl); background: none;
  font-size: 13.5px; font-weight: 500; color: var(--ink-2);
  text-align: left; cursor: pointer;
}
.navitem:hover { background: var(--surface-3); color: var(--ink); }
.navitem[aria-current="true"] { background: var(--brand-wash); color: var(--brand); font-weight: 600; }
.navitem[aria-current="true"] .navitem__ico { color: var(--brand); }
.navitem__ico { width: 18px; height: 18px; flex: none; color: var(--ink-4); }
.navitem__badge {
  margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 100px;
  background: var(--critical); color: #fff;
  font-size: 10.5px; font-weight: 700; text-align: center;
}

.stage { padding: 26px 30px 60px; min-width: 0; }
.stage--bench {
  background:
    radial-gradient(120% 90% at 50% -10%, #f7f8fd 0%, transparent 60%),
    repeating-linear-gradient(45deg, transparent 0 11px, rgba(18,23,43,.016) 11px 22px),
    var(--paper);
  display: grid; place-items: start center;
}

.pagehead { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
.pagehead h1 { font-size: 23px; letter-spacing: -.022em; }
.pagehead p { font-size: 13px; color: var(--ink-3); margin-top: 3px; max-width: 62ch; }
.pagehead__act { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ── Primitives ─────────────────────────────────────────────────────────── */

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-card); box-shadow: var(--shadow-1);
}
.card__hd {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.card__hd h3 { font-size: 14px; }
.card__hd .sub { font-size: 12px; color: var(--ink-4); }
.card__hd .act { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card__bd { padding: 18px; }
.card__ft {
  padding: 12px 18px; border-top: 1px solid var(--line);
  background: var(--surface-2); border-radius: 0 0 var(--r-card) var(--r-card);
  font-size: 12px; color: var(--ink-3);
}

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-main { grid-template-columns: minmax(0,1.62fr) minmax(0,1fr); align-items: start; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 14px; border-radius: var(--r-ctl);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .12s ease, border-color .12s ease, transform .12s ease;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-4); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn--danger { background: var(--critical); border-color: var(--critical); color: #fff; }
.btn--danger:hover { background: #b93232; border-color: #b93232; }
.btn--ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn--ghost:hover { background: var(--surface-3); border-color: transparent; }
.btn--lg { padding: 12px 20px; font-size: 14.5px; width: 100%; }
.btn__ico { width: 16px; height: 16px; flex: none; }

.field { display: block; margin-bottom: 14px; }
.field__lb {
  display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px;
}
.field__hint { font-size: 11.5px; color: var(--ink-4); margin-top: 4px; }
.input, .select {
  width: 100%; padding: 9px 11px;
  border: 1px solid var(--line-2); border-radius: var(--r-ctl);
  background: var(--surface); font-size: 13.5px;
}
.input:focus, .select:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: var(--brand); }
.input--big { font-size: 26px; font-weight: 600; padding: 12px 14px; font-variant-numeric: tabular-nums; }
.input::placeholder { color: var(--ink-4); }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 100px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill--good { background: var(--good-wash); color: #0a7a0a; }
.pill--warn { background: var(--warn-wash); color: #8a5f04; }
.pill--crit { background: var(--crit-wash); color: #a92e2e; }
.pill--mute { background: var(--surface-3); color: var(--ink-3); }
.pill--info { background: var(--data-wash); color: var(--data-600); }

.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-4);
  padding: 0 14px 8px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl .r { text-align: right; }
.tblwrap { overflow-x: auto; }

.empty { padding: 40px 20px; text-align: center; color: var(--ink-4); font-size: 13px; }
.empty svg { width: 30px; height: 30px; margin-bottom: 10px; opacity: .5; }

.sep { height: 1px; background: var(--line); margin: 16px 0; border: 0; }

.note {
  display: flex; gap: 11px; padding: 12px 14px; border-radius: var(--r-ctl);
  background: var(--data-wash); border: 1px solid #cfe1f8;
  font-size: 12.5px; color: #1c4f8c; line-height: 1.45;
}
.note--warn { background: var(--warn-wash); border-color: #f0dcb4; color: #7a5502; }
.note svg { width: 17px; height: 17px; flex: none; margin-top: 1px; }
.note b { font-weight: 700; }

/* ── Tuiles de statistique ──────────────────────────────────────────────── */

.stat { padding: 16px 18px; }
.stat__lb { font-size: 12px; color: var(--ink-3); }
.stat__v { font-size: 27px; font-weight: 600; letter-spacing: -.02em; margin-top: 4px; line-height: 1.1; }
.stat__d { font-size: 12px; margin-top: 5px; color: var(--ink-4); display: flex; align-items: center; gap: 5px; }
.stat__d svg { width: 14px; height: 14px; flex: none; }
.stat__d b { font-weight: 600; }
.stat__d--up b { color: #006300; }
.stat__d--down b { color: var(--critical); }
.stat__spark { margin-top: 10px; display: block; }

.hero-fig { font-size: 52px; font-weight: 600; letter-spacing: -.035em; line-height: 1; }
</style>

<style>
/* ── Espace salarié : le téléphone sur le plan de travail ───────────────── */

.device {
  width: 392px; max-width: 100%;
  border-radius: 46px; padding: 11px;
  background: linear-gradient(160deg, #2b3149 0%, #161a2b 42%, #0d1020 100%);
  box-shadow: var(--shadow-3), inset 0 1px 0 rgba(255,255,255,.16);
  margin-top: 6px;
}
.device__screen {
  position: relative; overflow: hidden;
  border-radius: 36px; background: var(--surface-2);
  height: 748px; display: flex; flex-direction: column;
}
.device__island {
  position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
  width: 104px; height: 26px; border-radius: 100px; background: #0d1020; z-index: 6;
}
.device__caption {
  text-align: center; font-size: 11.5px; color: var(--ink-4); margin-top: 12px;
}

.phone__status {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 24px 6px; font-size: 12px; font-weight: 600; flex: none;
}
.phone__status .sigs { display: flex; gap: 4px; align-items: center; color: var(--ink-2); }
.phone__body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 18px 20px; }
.phone__body::-webkit-scrollbar { width: 0; }
.phone__tabs {
  flex: none; display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line); background: var(--surface);
  padding: 7px 6px 12px;
}
.ptab {
  border: 0; background: none; cursor: pointer; padding: 6px 2px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600; color: var(--ink-4); border-radius: 8px;
}
.ptab svg { width: 21px; height: 21px; }
.ptab[aria-current="true"] { color: var(--brand); }

.phone__h {
  display: flex; align-items: center; gap: 10px; padding: 6px 2px 14px;
}
.phone__h h2 { font-size: 19px; letter-spacing: -.02em; }
.phone__h .act { margin-left: auto; }

/* La carte : le seul objet où le dessin prend le pas sur l'information. */
.paycard {
  position: relative; overflow: hidden;
  border-radius: 16px; padding: 18px;
  color: #fff;
  background:
    radial-gradient(120% 150% at 12% 0%, #2b2bb8 0%, transparent 55%),
    linear-gradient(148deg, #14146b 0%, #000091 46%, #060632 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 14px 30px -14px rgba(0,0,80,.7);
}
.paycard::after {           /* guilloche : trame gravée, purement décorative */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .14;
  background:
    repeating-linear-gradient(58deg, transparent 0 6px, rgba(255,255,255,.55) 6px 6.6px),
    repeating-linear-gradient(-58deg, transparent 0 9px, rgba(255,255,255,.4) 9px 9.5px);
  -webkit-mask-image: radial-gradient(90% 120% at 82% 8%, #000 0%, transparent 72%);
          mask-image: radial-gradient(90% 120% at 82% 8%, #000 0%, transparent 72%);
}
.paycard__top { display: flex; align-items: flex-start; gap: 12px; position: relative; }
.paycard__brand { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; }
.paycard__min { font-size: 9.5px; opacity: .72; letter-spacing: .05em; text-transform: uppercase; margin-top: 2px; }
.paycard__chip {
  margin-left: auto; width: 34px; height: 26px; border-radius: 5px;
  background: linear-gradient(150deg, #f7d67a 0%, #c99b47 44%, #e8cf95 100%);
}
.paycard__bal { position: relative; margin-top: 22px; }
.paycard__bal .lb { font-size: 10.5px; opacity: .74; letter-spacing: .06em; text-transform: uppercase; }
.paycard__bal .v { font-size: 40px; font-weight: 600; letter-spacing: -.03em; line-height: 1.05; }
.paycard__foot {
  position: relative; margin-top: 18px; display: flex; align-items: flex-end; gap: 14px;
  font-size: 11px; opacity: .8;
}
.paycard__foot .num { letter-spacing: .12em; }

.qbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.qbtn {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 13px 6px; border-radius: var(--r-ctl);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-size: 11.5px; font-weight: 600; color: var(--ink-2);
}
.qbtn:hover { border-color: var(--brand); color: var(--brand); }
.qbtn svg { width: 20px; height: 20px; }

.txnrow {
  display: flex; align-items: center; gap: 12px; padding: 11px 2px;
  border-bottom: 1px solid var(--line); width: 100%; text-align: left;
  background: none; border-left: 0; border-right: 0; border-top: 0; cursor: default;
}
.txnrow__ico {
  width: 36px; height: 36px; border-radius: 9px; flex: none;
  display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2);
}
.txnrow__ico svg { width: 18px; height: 18px; }
.txnrow__ico--in { background: var(--good-wash); color: #0a7a0a; }
.txnrow__m { min-width: 0; flex: 1; }
.txnrow__t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txnrow__s { font-size: 11.5px; color: var(--ink-4); }
.txnrow__a { font-size: 14px; font-weight: 600; white-space: nowrap; }
.txnrow__a--in { color: #006300; }

/* ── QR de paiement ─────────────────────────────────────────────────────── */

.qrstage { display: flex; flex-direction: column; align-items: center; text-align: center; }
.qrframe {
  position: relative; padding: 16px; border-radius: 18px;
  background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-2);
}
.qrframe canvas { display: block; width: 232px; height: 232px; image-rendering: pixelated; }
.qrframe--dead canvas { opacity: .12; filter: grayscale(1); }
.qrframe__over {
  position: absolute; inset: 0; display: none; place-items: center; padding: 24px;
  border-radius: 18px; background: rgba(255,255,255,.86); text-align: center;
}
.qrframe--dead .qrframe__over { display: grid; }

.qrtimer { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.qrtimer__ring { width: 34px; height: 34px; flex: none; }
.qrtimer__t { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qrtimer__s { font-size: 11.5px; color: var(--ink-4); }

.qrtoken {
  margin-top: 14px; padding: 9px 12px; border-radius: var(--r-ctl);
  background: var(--surface-3); font-family: var(--mono); font-size: 11.5px;
  color: var(--ink-2); word-break: break-all; text-align: left; line-height: 1.5;
}

.paid {
  display: grid; place-items: center; gap: 14px; padding: 40px 10px; text-align: center;
}
.paid__mark {
  width: 74px; height: 74px; border-radius: 50%; background: var(--good-wash);
  display: grid; place-items: center; color: #0a7a0a;
  animation: pop .42s cubic-bezier(.2,.8,.2,1) both;
}
.paid__mark svg { width: 36px; height: 36px; }
@keyframes pop { from { transform: scale(.55); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ── Partenaires : liste et carte ───────────────────────────────────────── */

.plist { display: flex; flex-direction: column; }
.pitem {
  display: flex; align-items: center; gap: 12px; padding: 12px 2px;
  border-bottom: 1px solid var(--line); text-align: left;
  background: none; border-top: 0; border-left: 0; border-right: 0;
  width: 100%; cursor: pointer;
}
.pitem:hover { background: var(--surface-2); }
.pitem__ico {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  display: grid; place-items: center; background: var(--brand-wash); color: var(--brand);
}
.pitem__ico svg { width: 19px; height: 19px; }
.pitem__m { flex: 1; min-width: 0; }
.pitem__t { font-size: 13.5px; font-weight: 600; }
.pitem__s { font-size: 11.5px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pitem__d { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

.mapbox {
  position: relative; border-radius: var(--r-card); overflow: hidden;
  border: 1px solid var(--line); background: #eaeef7;
}
.mapbox svg { display: block; width: 100%; height: auto; }
.mappin { cursor: pointer; }
.mappin circle.hit { fill: transparent; }
.maplegend {
  position: absolute; left: 10px; bottom: 10px;
  background: rgba(255,255,255,.92); border: 1px solid var(--line);
  border-radius: var(--r-ctl); padding: 7px 10px; font-size: 11px; color: var(--ink-3);
}

  const d = new Date(ts);
  const s = d.getDate() + " " + M_COURT[d.getMonth()] + " " + d.getFullYear();

    + (cls ? ' class="' + cls + '"' : "") + '>' + (ICO[name] || "") + '</svg>';
}

<script>
"use strict";
/* ============================================================================
   2. Encodeur QR (ISO/IEC 18004) — mode octet, niveau de correction M,
      versions 1 à 4.

      Écrit ici plutôt qu'importé : le cahier des charges impose que le QR de
      paiement fonctionne en connectivité dégradée (§2.2). Un démonstrateur qui
      irait chercher une bibliothèque sur un CDN pour dessiner ce QR se
      contredirait lui-même. Aucune dépendance : la page entière fonctionne
      hors ligne.
   ========================================================================= */

const QR = (function () {

  /* -- Corps de Galois GF(256), polynôme primitif 0x11d -------------------- */
  const EXP = new Array(512), LOG = new Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  const gmul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

  function genPoly(n) {
    let p = [1];
    for (let i = 0; i < n; i++) {
      const r = new Array(p.length + 1).fill(0);
      for (let j = 0; j < p.length; j++) { r[j] ^= p[j]; r[j + 1] ^= gmul(p[j], EXP[i]); }
      p = r;
    }
    return p;
  }
  function eccOf(data, n) {
    const gen = genPoly(n);
    const res = data.slice().concat(new Array(n).fill(0));
    for (let i = 0; i < data.length; i++) {
      const f = res[i];
      if (f === 0) continue;
      for (let j = 0; j < gen.length; j++) res[i + j] ^= gmul(gen[j], f);
    }
    return res.slice(data.length);
  }

  /* -- Tables de version, niveau M ---------------------------------------- */
  // ecPerBlock = mots de correction par bloc ; blocks = [nb de blocs, mots de données par bloc]
  const VERSIONS = {
    1: { size: 21, ecPerBlock: 10, blocks: [[1, 16]], align: [],       remainder: 0 },
    2: { size: 25, ecPerBlock: 16, blocks: [[1, 28]], align: [6, 18],  remainder: 7 },
    3: { size: 29, ecPerBlock: 26, blocks: [[1, 44]], align: [6, 22],  remainder: 7 },
    4: { size: 33, ecPerBlock: 18, blocks: [[2, 32]], align: [6, 26],  remainder: 7 }
  };
  const dataCodewords = v =>
    VERSIONS[v].blocks.reduce((s, b) => s + b[0] * b[1], 0);
  // 4 bits de mode + 8 bits de longueur (versions 1 à 9) en tête du flux
  const capacity = v => Math.floor((dataCodewords(v) * 8 - 12) / 8);

  const G15 = 0x537, G15_MASK = 0x5412;
  function bchDigit(d) { let n = 0; while (d !== 0) { n++; d >>>= 1; } return n; }
  function formatBits(mask) {
    const data = (0 /* niveau M */ << 3) | mask;   // niveau M = 0b00
    let d = data << 10;
    while (bchDigit(d) - bchDigit(G15) >= 0) d ^= (G15 << (bchDigit(d) - bchDigit(G15)));
    return ((data << 10) | d) ^ G15_MASK;
  }

  const MASKS = [
    (i, j) => (i + j) % 2 === 0,
    (i, j) => i % 2 === 0,
    (i, j) => j % 3 === 0,
    (i, j) => (i + j) % 3 === 0,
    (i, j) => (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0,
    (i, j) => (i * j) % 2 + (i * j) % 3 === 0,
    (i, j) => ((i * j) % 2 + (i * j) % 3) % 2 === 0,
    (i, j) => ((i * j) % 3 + (i + j) % 2) % 2 === 0
  ];

  /* -- Construction de la matrice ----------------------------------------- */
  function blank(size) {
    return { m: Array.from({ length: size }, () => new Array(size).fill(null)),
             fn: Array.from({ length: size }, () => new Array(size).fill(false)), size: size };
  }
  function put(g, r, c, v) { g.m[r][c] = v; g.fn[r][c] = true; }

  function finder(g, r0, c0) {
    for (let r = -1; r <= 7; r++) for (let c = -1; c <= 7; c++) {
      const r1 = r0 + r, c1 = c0 + c;
      if (r1 < 0 || c1 < 0 || r1 >= g.size || c1 >= g.size) continue;
      const on = (r >= 0 && r <= 6 && (c === 0 || c === 6))
              || (c >= 0 && c <= 6 && (r === 0 || r === 6))
              || (r >= 2 && r <= 4 && c >= 2 && c <= 4);
      put(g, r1, c1, on ? 1 : 0);
    }
  }

  function functionPatterns(g, ver) {
    const size = g.size, cfg = VERSIONS[ver];
    finder(g, 0, 0); finder(g, 0, size - 7); finder(g, size - 7, 0);

    for (let i = 8; i < size - 8; i++) {          // rythme
      const v = i % 2 === 0 ? 1 : 0;
      put(g, 6, i, v); put(g, i, 6, v);
    }
    const A = cfg.align;                           // motifs d'alignement
    for (let a = 0; a < A.length; a++) for (let b = 0; b < A.length; b++) {
      const r = A[a], c = A[b];
      if ((r <= 8 && c <= 8) || (r <= 8 && c >= size - 9) || (r >= size - 9 && c <= 8)) continue;
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++)
        put(g, r + dr, c + dc, (Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0)) ? 1 : 0);
    }
    for (let i = 0; i < 9; i++) {                  // zones réservées au format
      if (g.m[8][i] === null) put(g, 8, i, 0);
      if (g.m[i][8] === null) put(g, i, 8, 0);
    }
    for (let i = 0; i < 8; i++) {
      if (g.m[8][size - 1 - i] === null) put(g, 8, size - 1 - i, 0);
      if (g.m[size - 1 - i][8] === null) put(g, size - 1 - i, 8, 0);
    }
    put(g, size - 8, 8, 1);                        // module toujours noir
  }

  function placeData(g, bytes) {
    const size = g.size;
    let inc = -1, row = size - 1, bit = 7, byte = 0;
    for (let col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (;;) {
        for (let c = 0; c < 2; c++) {
          const cc = col - c;
          if (g.m[row][cc] === null) {
            let dark = 0;
            if (byte < bytes.length) dark = (bytes[byte] >>> bit) & 1;
            g.m[row][cc] = dark;
            if (--bit === -1) { byte++; bit = 7; }
          }
        }
        row += inc;
        if (row < 0 || row >= size) { row -= inc; inc = -inc; break; }
      }
    }
  }

  function applied(g, mask) {
    const size = g.size, out = g.m.map(r => r.slice());
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++)
      if (!g.fn[r][c] && MASKS[mask](r, c)) out[r][c] ^= 1;
    const bits = formatBits(mask);
    for (let i = 0; i < 15; i++) {
      const v = (bits >> i) & 1;
      if (i < 6) out[i][8] = v; else if (i < 8) out[i + 1][8] = v; else out[size - 15 + i][8] = v;
      if (i < 8) out[8][size - 1 - i] = v; else if (i < 9) out[8][15 - i] = v; else out[8][14 - i] = v;
    }
    out[size - 8][8] = 1;
    return out;
  }

  /* Pénalités normatives : plus le score est bas, meilleur est le masque. */
  function penalty(m) {
    const n = m.length;
    let score = 0;

    for (let pass = 0; pass < 2; pass++) {          // règle 1 : suites de 5+
      for (let a = 0; a < n; a++) {
        let run = 1, prev = pass ? m[0][a] : m[a][0];
        for (let b = 1; b < n; b++) {
          const v = pass ? m[b][a] : m[a][b];
          if (v === prev) { run++; } else { if (run >= 5) score += 3 + (run - 5); run = 1; prev = v; }
        }
        if (run >= 5) score += 3 + (run - 5);
      }
    }
    for (let r = 0; r < n - 1; r++) for (let c = 0; c < n - 1; c++) {   // règle 2 : blocs 2×2
      const v = m[r][c];
      if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) score += 3;
    }
    const P = [1,0,1,1,1,0,1];                       // règle 3 : motif de leurre
    for (let pass = 0; pass < 2; pass++) {
      for (let a = 0; a < n; a++) for (let b = 0; b <= n - 7; b++) {
        let hit = true;
        for (let k = 0; k < 7; k++) if ((pass ? m[b + k][a] : m[a][b + k]) !== P[k]) { hit = false; break; }
        if (!hit) continue;
        const before = [];
        for (let k = b - 4; k < b; k++) before.push(k < 0 ? 0 : (pass ? m[k][a] : m[a][k]));
        const after = [];
        for (let k = b + 7; k < b + 11; k++) after.push(k >= n ? 0 : (pass ? m[k][a] : m[a][k]));
        if (before.every(v => v === 0) || after.every(v => v === 0)) score += 40;
      }
    }
    let dark = 0;                                    // règle 4 : équilibre noir/blanc
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) dark += m[r][c];
    score += Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
    return score;
  }

  /* -- API ---------------------------------------------------------------- */
  function encode(text) {
    const data = [];
    for (let i = 0; i < text.length; i++) {          // le jeton est en ASCII
      const cp = text.charCodeAt(i);
      if (cp > 255) throw new Error("QR : caractère hors ASCII");
      data.push(cp);
    }
    let ver = 0;
    for (let v = 1; v <= 4; v++) if (data.length <= capacity(v)) { ver = v; break; }
    if (!ver) throw new Error("QR : charge utile trop longue (" + data.length + " octets)");

    const cfg = VERSIONS[ver], total = dataCodewords(ver);

    // Flux binaire : mode 0100, longueur sur 8 bits, données, terminateur, bourrage
    let bits = "0100" + data.length.toString(2).padStart(8, "0");
    data.forEach(b => { bits += b.toString(2).padStart(8, "0"); });
    bits += "0000".slice(0, Math.min(4, total * 8 - bits.length));
    while (bits.length % 8) bits += "0";
    const words = [];
    for (let i = 0; i < bits.length; i += 8) words.push(parseInt(bits.substr(i, 8), 2));
    const PAD = [0xEC, 0x11];
    for (let i = 0; words.length < total; i++) words.push(PAD[i % 2]);

    // Découpage en blocs, correction d'erreur, puis entrelacement
    const dBlocks = [], eBlocks = [];
    let off = 0;
    cfg.blocks.forEach(([count, per]) => {
      for (let i = 0; i < count; i++) {
        const blk = words.slice(off, off + per); off += per;
        dBlocks.push(blk);
        eBlocks.push(eccOf(blk, cfg.ecPerBlock));
      }
    });
    const out = [];
    const maxD = Math.max.apply(null, dBlocks.map(b => b.length));
    for (let i = 0; i < maxD; i++) dBlocks.forEach(b => { if (i < b.length) out.push(b[i]); });
    for (let i = 0; i < cfg.ecPerBlock; i++) eBlocks.forEach(b => out.push(b[i]));

    const g = blank(cfg.size);
    functionPatterns(g, ver);
    const stream = out.slice();
    if (cfg.remainder) stream.push(0);               // bits restants, à zéro
    placeData(g, stream);

    let best = null, bestScore = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      const cand = applied(g, mask), s = penalty(cand);
      if (s < bestScore) { bestScore = s; best = cand; }
    }
    return { modules: best, size: cfg.size, version: ver };
  }

  /* Dessine sur un canvas, zone de silence de 4 modules comprise. */
  function draw(canvas, text, px) {
    const qr = encode(text);
    const quiet = 4, n = qr.size + quiet * 2;
    const scale = Math.max(1, Math.floor((px || 232) / n));
    const side = scale * n;
    canvas.width = side; canvas.height = side;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, side, side);
    ctx.fillStyle = "#12172b";
    for (let r = 0; r < qr.size; r++) for (let c = 0; c < qr.size; c++)
      if (qr.modules[r][c]) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
    return qr;
  }

  return { encode, draw, capacity };
})();
</script>

      schéma reproduit néanmoins celui d'une base relationnelle — employeurs,
      salariés, partenaires, transactions, rechargements, jetons — pour que le

   ========================================================================= */

];

  "Hauts-de-France", "Nouvelle-Aquitaine", "Occitanie", "Pays de la Loire", "Grand Est"];

const STATUS = {
  active:    { label: "Actif",       pill: "pill--good" },
  pending:   { label: "En attente",  pill: "pill--warn" },
  suspended: { label: "Suspendu",    pill: "pill--crit" },
  closed:    { label: "Clôturé",     pill: "pill--mute" },

};

let DB = null;

/* Générateur pseudo-aléatoire à graine : l'historique de démonstration doit
   être le même à chaque réinitialisation, sinon les graphiques changent de
   forme entre deux présentations. */
function rng(seed) {
  let s = seed >>> 0;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function seed() {
  const R = rng(20260202);
  const pick = arr => arr[Math.floor(R() * arr.length)];
  const between = (a, b) => a + Math.floor(R() * (b - a + 1));

  const employers = [

  ];

  const employees = [

  const P = (id, name, cat, addr, city, region, x, y, st, days) => ({

    P("PRT-004", "Studio Forme",           "sport",        "9 avenue de la Gare",    "Lille",      "Hauts-de-France",            0.22, 0.62, "active", 81),
    P("PRT-005", "Le Panier Bio",          "alimentation", "55 cours Berriat",       "Grenoble",   "Auvergne-Rhône-Alpes",       0.78, 0.56, "active", 76),
    P("PRT-006", "Cinéma Le Rex",          "culture",      "3 boulevard Gambetta",   "Bordeaux",   "Nouvelle-Aquitaine",         0.44, 0.72, "active", 70),
    P("PRT-007", "Table de Marseille",     "restauration", "18 quai du Port",        "Marseille",  "Provence-Alpes-Côte d'Azur", 0.60, 0.80, "active", 64),
    P("PRT-008", "Vélo Cité",              "transport",    "2 rue Nationale",        "Nantes",     "Pays de la Loire",           0.14, 0.40, "active", 58),
    P("PRT-009", "Institut Bellevue",      "bienetre",     "31 rue Saint-Rome",      "Toulouse",   "Occitanie",                  0.86, 0.34, "active", 51),

    degraded: false,
    counters: { txn: 0, topup: 0 }
  };

  /* Historique : 90 jours de rechargements mensuels et de dépenses. */
  const now = Date.now();
  const actifs = partners.filter(p => p.status === "active");

  for (let m = 6; m >= 1; m--) {
    const at = now - m * 30 * 864e5;

      });

  for (let d = 88; d >= 0; d--) {
    const day = new Date(now - d * 864e5);

    const count = we ? between(0, 2) : between(1, 4);
    for (let k = 0; k < count; k++) {
      const e = pick(employees);
      const p = pick(actifs);
      const amount = between(340, 4200);
      if (e.balance < amount) continue;
      const at = new Date(day.getFullYear(), day.getMonth(), day.getDate(),
                          between(8, 20), between(0, 59)).getTime();
      commitTxn(db, e, p, amount, at, "qr");

  db.txns.sort((a, b) => a.at - b.at);
  rechain(db);

}

/* Enregistre une transaction et chaîne son empreinte à la précédente. Une fois
   écrite, une transaction n'est jamais modifiée ni supprimée (§2.2, §3.2) : le
   seul mouvement inverse possible serait une nouvelle transaction. */
function commitTxn(db, employee, partner, amount, at, channel) {
  const prev = db.txns.length ? db.txns[db.txns.length - 1].hash : "0".repeat(8);
  const ref = "TRX-" + String(++db.counters.txn).padStart(6, "0");
  const t = {
    id: ref, ref, employeeId: employee.id, partnerId: partner.id,
    amount, at: at || Date.now(), channel: channel || "qr",
    status: "validated", prev, hash: ""
  };
  t.hash = fnv1a([prev, ref, t.employeeId, t.partnerId, t.amount, t.at].join("|"));
  employee.balance -= amount;
  db.txns.push(t);
  return t;
}

function rechain(db) {
  let prev = "0".repeat(8);
  db.txns.forEach(t => {
    t.prev = prev;
    t.hash = fnv1a([prev, t.ref, t.employeeId, t.partnerId, t.amount, t.at].join("|"));
    prev = t.hash;
  });
}

function verifyLedger(db) {
  let prev = "0".repeat(8);
  for (let i = 0; i < db.txns.length; i++) {
    const t = db.txns[i];
    const h = fnv1a([prev, t.ref, t.employeeId, t.partnerId, t.amount, t.at].join("|"));
    if (t.prev !== prev || t.hash !== h)
      return { ok: false, index: i, ref: t.ref, expected: h, found: t.hash };
    prev = t.hash;
  }
  return { ok: true, count: db.txns.length, head: prev };
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* navigation privée */ }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.txns && parsed.partners) return parsed;
    }
  } catch (e) { /* stockage indisponible ou corrompu : on repart du jeu de démonstration */ }
  return null;
}
function resetDB() { DB = seed(); save(); }

const emp = id => DB.employees.find(e => e.id === id);
const prt = id => DB.partners.find(p => p.id === id);
const emr = id => DB.employers.find(e => e.id === id);
const me  = () => emp(DB.session.employeeId);
const mypartner = () => prt(DB.session.partnerId);

/* Bus d'événements : c'est lui qui fait que le solde du salarié se met à jour
   « en temps réel » (§2.2) quand le partenaire valide de son côté. */
const BUS = {
  h: {},
  on(evt, fn) { (this.h[evt] = this.h[evt] || []).push(fn); },
  emit(evt, data) { (this.h[evt] || []).forEach(fn => fn(data)); }
};
</script>

<script>
"use strict";
/* ============================================================================
   4. API REST simulée

      Toutes les vues passent par ici — aucune n'écrit directement dans DB.
      C'est ce qui permet à la console de montrer, pendant la démonstration, la
      requête exacte que déclenche chaque geste, et ce qui rendra le
      remplacement par un vrai backend mécanique : seule cette couche change.
   ========================================================================= */

const API = (function () {

  const PREFIX = "/api/v1";
  const logs = [];
  let listeners = [];

  const err = (status, code, message) => { const e = new Error(message); e.status = status; e.body = { error: code, message }; throw e; };
  const wait = ms => new Promise(r => setTimeout(r, ms));

  /* ---- Table de routage ------------------------------------------------- */
  // offline:true  → l'appel reste possible en connectivité dégradée
  const ROUTES = [

    { m: "POST", p: /^\/auth\/session$/, offline: true, h: (_, b) => {
        if (!["employee", "partner", "admin"].includes(b.role)) err(400, "invalid_role", "Rôle inconnu");
        DB.session.role = b.role;
        return { role: b.role, issuedAt: Date.now(), expiresIn: 3600 };
      } },

    { m: "GET", p: /^\/employees\/([\w-]+)$/, h: a => {
        const e = emp(a[1]) || err(404, "not_found", "Salarié inconnu");
        return { id: e.id, name: e.name, email: e.email, employer: emr(e.employerId).name, since: e.since };
      } },

    // Point d'entrée prévu pour l'interconnexion avec les SIRH employeurs (§3.3)
    { m: "GET", p: /^\/employees\/([\w-]+)\/balance$/, offline: true, h: a => {
        const e = emp(a[1]) || err(404, "not_found", "Salarié inconnu");
        return { employeeId: e.id, balance: e.balance, currency: "EUR", asOf: new Date().toISOString() };
      } },

    { m: "GET", p: /^\/employees\/([\w-]+)\/transactions$/, h: (a, _, q) => {
        const e = emp(a[1]) || err(404, "not_found", "Salarié inconnu");
        let rows = DB.txns.filter(t => t.employeeId === e.id).slice().reverse();
        if (q.month) rows = rows.filter(t => new Date(t.at).toISOString().slice(0, 7) === q.month);
        return paginate(rows.map(publicTxn), q);
      } },

    { m: "POST", p: /^\/payment-tokens$/, offline: true, h: (_, b) => {
        const e = emp(b.employeeId) || err(404, "not_found", "Salarié inconnu");
        if (e.balance <= 0) err(402, "empty_balance", "Solde épuisé");
        DB.tokens = DB.tokens.filter(t => t.expiresAt > Date.now() - 3600e3);
        const tok = {
          token: uid(16), employeeId: e.id,
          issuedAt: Date.now(), expiresAt: Date.now() + 5 * 60e3,   // 5 minutes (§3.2)
          usedAt: null, offline: !!DB.degraded
        };
        DB.tokens.push(tok); save();
        return tok;
      } },

    { m: "GET", p: /^\/payment-tokens\/([\w-]+)$/, h: a => {
        const t = DB.tokens.find(x => x.token === a[1]) || err(404, "unknown_token", "Jeton inconnu");
        if (t.usedAt) err(409, "token_used", "Jeton déjà utilisé");
        if (t.expiresAt < Date.now()) err(410, "token_expired", "Jeton expiré");
        const e = emp(t.employeeId);
        return { token: t.token, employee: { id: e.id, name: e.name }, expiresAt: t.expiresAt };
      } },

    { m: "POST", p: /^\/transactions$/, h: (_, b) => {
        const t = DB.tokens.find(x => x.token === b.token) || err(404, "unknown_token", "Jeton inconnu");
        if (t.usedAt) err(409, "token_used", "Jeton déjà utilisé");
        // Un encaissement capturé hors ligne est daté par le partenaire : c'est
        // cette date-là qui est comparée à la validité du jeton, sinon aucune
        // reprise de connexion ne pourrait aboutir (§2.2, mode dégradé).
        const captured = b.capturedAt ? Number(b.capturedAt) : Date.now();
        if (t.expiresAt < captured) err(410, "token_expired", "Jeton expiré");
        const p = prt(b.partnerId) || err(404, "not_found", "Partenaire inconnu");
        if (p.status !== "active") err(403, "partner_inactive", "Compte partenaire non actif");
        const amount = Math.round(Number(b.amount));
        if (!(amount > 0)) err(400, "invalid_amount", "Montant invalide");
        const e = emp(t.employeeId);
        if (e.balance < amount) err(402, "insufficient_funds", "Solde insuffisant");

        t.usedAt = Date.now();                       // jeton à usage unique (§3.2)
        const txn = commitTxn(DB, e, p, amount, captured, b.channel || "qr");
        save();
        BUS.emit("txn", { txn, employee: e, partner: p });
        return publicTxn(txn);
      } },

    { m: "GET", p: /^\/partners$/, offline: true, h: (_, __, q) => {
        let rows = DB.partners.filter(p => q.all ? true : p.status === "active");
        if (q.status) rows = rows.filter(p => p.status === q.status);
        if (q.category) rows = rows.filter(p => p.category === q.category);
        if (q.query) {
          const s = q.query.toLowerCase();
          rows = rows.filter(p => (p.name + " " + p.city + " " + catLabel(p.category)).toLowerCase().includes(s));
        }
        rows = rows.slice().sort((a, b) => a.name.localeCompare(b.name, "fr"));
        return paginate(rows.map(publicPartner), q);
      } },

    { m: "GET", p: /^\/partners\/([\w-]+)$/, h: a => {
        const p = prt(a[1]) || err(404, "not_found", "Partenaire inconnu");
        return publicPartner(p, true);
      } },

    { m: "POST", p: /^\/partners$/, h: (_, b) => {
        if (!b.name || !b.category || !b.city) err(400, "missing_fields", "Champs obligatoires manquants");
        const p = {
          id: "PRT-" + String(DB.partners.length + 1).padStart(3, "0"),
          name: b.name, category: b.category, address: b.address || "", city: b.city,
          region: b.region || REGIONS[0], siret: b.siret || "", contact: b.contact || "",
          iban: b.iban || "", x: 0.2 + Math.random() * 0.6, y: 0.2 + Math.random() * 0.6,
          status: "pending", createdAt: Date.now()       // validation manuelle obligatoire (§2.2)
        };
        DB.partners.push(p); save();
        return publicPartner(p, true);
      } },

    { m: "PATCH", p: /^\/partners\/([\w-]+)$/, h: (a, b) => {
        const p = prt(a[1]) || err(404, "not_found", "Partenaire inconnu");
        if (!STATUS[b.status]) err(400, "invalid_status", "Statut inconnu");
        const before = p.status;
        p.status = b.status;
        DB.audit.unshift({ at: Date.now(), actor: "admin", target: p.id,
          action: "status", from: before, to: b.status, note: b.note || "" });
        save();
        return publicPartner(p, true);
      } },

    { m: "GET", p: /^\/partners\/([\w-]+)\/transactions$/, h: (a, _, q) => {
        const p = prt(a[1]) || err(404, "not_found", "Partenaire inconnu");
        let rows = DB.txns.filter(t => t.partnerId === p.id).slice().reverse();
        if (q.since) rows = rows.filter(t => t.at >= Number(q.since));
        return paginate(rows.map(publicTxn), q);
      } },

    { m: "POST", p: /^\/topups$/, h: (_, b) => {
        const employer = emr(b.employerId) || err(404, "not_found", "Employeur inconnu");
        const amount = Math.round(Number(b.amount));
        if (!(amount > 0)) err(400, "invalid_amount", "Montant invalide");
        const ids = b.employeeIds && b.employeeIds.length
          ? b.employeeIds
          : DB.employees.filter(e => e.employerId === employer.id).map(e => e.id);
        const lines = ids.map(id => {
          const e = emp(id) || err(404, "not_found", "Salarié inconnu : " + id);
          e.balance += amount;
          const t = { id: "RCH-" + String(++DB.counters.topup).padStart(5, "0"),
                      employerId: employer.id, employeeId: e.id, amount,
                      at: Date.now(), label: b.label || "Rechargement" };
          DB.topups.unshift(t);
          return t;
        });
        save();
        BUS.emit("topup", { lines });
        return { credited: lines.length, amount, total: amount * lines.length, lines };
      } },

    { m: "GET", p: /^\/admin\/stats$/, h: () => stats() },

    { m: "GET", p: /^\/ledger\/verify$/, h: () => verifyLedger(DB) }
  ];

  /* ---- Documentation publiée dans la console ---------------------------- */
  const DOC = [
    ["POST",  "/auth/session",                        "Ouvre une session (employee · partner · admin)"],
    ["GET",   "/employees/{id}",                      "Fiche salarié"],
    ["GET",   "/employees/{id}/balance",              "Solde — point d'entrée SIRH employeur (§3.3)"],
    ["GET",   "/employees/{id}/transactions",         "Historique paginé (?page&size&month)"],
    ["POST",  "/payment-tokens",                      "Émet un jeton de paiement, valable 5 min, usage unique"],
    ["GET",   "/payment-tokens/{token}",              "Résout un jeton présenté par un salarié"],
    ["POST",  "/transactions",                        "Valide un encaissement — écriture définitive"],
    ["GET",   "/partners",                            "Catalogue paginé (?query&category&status&page&size)"],
    ["POST",  "/partners",                            "Demande d'adhésion — créée au statut « en attente »"],
    ["GET",   "/partners/{id}",                       "Fiche partenaire"],
    ["PATCH", "/partners/{id}",                       "Change le statut — réservé à l'administration"],
    ["GET",   "/partners/{id}/transactions",          "Encaissements du partenaire (?since)"],
    ["POST",  "/topups",                              "Rechargement employeur, individuel ou par lot"],
    ["GET",   "/admin/stats",                         "Indicateurs nationaux"],
    ["GET",   "/ledger/verify",                       "Vérifie la chaîne d'empreintes du registre"]
  ];

  /* ---- Représentations publiques ---------------------------------------- */
  function publicTxn(t) {
    const p = prt(t.partnerId), e = emp(t.employeeId);
    return { ref: t.ref, at: new Date(t.at).toISOString(), amount: t.amount, currency: "EUR",
             status: t.status, channel: t.channel,
             partner: p ? { id: p.id, name: p.name, category: p.category, city: p.city } : null,
             employee: e ? { id: e.id, name: e.name } : null,
             integrity: { prev: t.prev, hash: t.hash } };
  }
  function publicPartner(p, full) {
    const base = { id: p.id, name: p.name, category: p.category, categoryLabel: catLabel(p.category),
                   city: p.city, region: p.region, address: p.address, status: p.status,
                   x: p.x, y: p.y };
    if (!full) return base;
    const rows = DB.txns.filter(t => t.partnerId === p.id);
    return Object.assign(base, {
      siret: p.siret, contact: p.contact, iban: p.iban,
      createdAt: new Date(p.createdAt).toISOString(),
      totals: { count: rows.length, amount: rows.reduce((s, t) => s + t.amount, 0) }
    });
  }
  function paginate(rows, q) {
    const size = Math.max(1, Math.min(100, Number(q.size) || 10));
    const pages = Math.max(1, Math.ceil(rows.length / size));
    const page = Math.min(pages, Math.max(1, Number(q.page) || 1));
    return { items: rows.slice((page - 1) * size, page * size),
             page, size, pages, total: rows.length };
  }
  function stats() {
    const now = Date.now(), since30 = now - 30 * 864e5, since60 = now - 60 * 864e5;
    const vol = DB.txns.reduce((s, t) => s + t.amount, 0);
    const cur = DB.txns.filter(t => t.at >= since30);
    const prev = DB.txns.filter(t => t.at >= since60 && t.at < since30);
    const sum = a => a.reduce((s, t) => s + t.amount, 0);
    const byRegion = {}, byCat = {};
    DB.txns.forEach(t => {
      const p = prt(t.partnerId); if (!p) return;
      byRegion[p.region] = (byRegion[p.region] || 0) + t.amount;
      byCat[p.category] = (byCat[p.category] || 0) + t.amount;
    });
    return {
      volume: vol, volume30: sum(cur), volume30prev: sum(prev),
      count: DB.txns.length, count30: cur.length,
      partnersActive: DB.partners.filter(p => p.status === "active").length,
      partnersPending: DB.partners.filter(p => p.status === "pending").length,
      partnersTotal: DB.partners.length,
      employees: DB.employees.length,
      outstanding: DB.employees.reduce((s, e) => s + e.balance, 0),
      average: DB.txns.length ? Math.round(vol / DB.txns.length) : 0,
      byRegion, byCategory: byCat
    };
  }

  /* ---- Exécution -------------------------------------------------------- */
  function parseQuery(path) {
    const i = path.indexOf("?");
    if (i < 0) return { clean: path, q: {} };
    const q = {};
    new URLSearchParams(path.slice(i + 1)).forEach((v, k) => { q[k] = v; });
    return { clean: path.slice(0, i), q };
  }

  async function call(method, path, body) {
    const t0 = performance.now();
    const full = PREFIX + path;
    const { clean, q } = parseQuery(path);
    const route = ROUTES.find(r => r.m === method && r.p.test(clean));

    if (!route) return finish(method, full, 404, { error: "no_route", message: "Endpoint inconnu" }, t0, true);

    if (DB.degraded && !route.offline) {
      await wait(600 + Math.random() * 400);
      const e = new Error("Réseau indisponible");
      e.network = true; e.status = 0;
      finish(method, full, 0, { error: "network_unreachable", message: "Aucune réponse du serveur" }, t0, true);
      throw e;
    }

    await wait(70 + Math.random() * 150);
    try {
      const out = route.h(clean.match(route.p), body || {}, q);
      return finish(method, full, method === "POST" ? 201 : 200, out, t0, false);
    } catch (e) {
      finish(method, full, e.status || 500, e.body || { error: "server_error", message: e.message }, t0, true);
      throw e;
    }
  }

  function finish(method, path, status, body, t0, bad) {
    const entry = { method, path, status, body, ms: Math.round(performance.now() - t0), at: Date.now(), bad };
    logs.push(entry);
    if (logs.length > 240) logs.shift();
    listeners.forEach(fn => fn(entry));
    return body;
  }

  return { call, logs, doc: DOC, onLog: fn => listeners.push(fn),
           clear: () => { logs.length = 0; listeners.forEach(fn => fn(null)); },
           get: (p, q) => call("GET", p + (q ? "?" + new URLSearchParams(q) : "")),
           post: (p, b) => call("POST", p, b),
           patch: (p, b) => call("PATCH", p, b) };
})();
</script>

<script>
"use strict";
/* ============================================================================
   5. Briques d'interface : notifications, fenêtres, pagination, graphiques
   ========================================================================= */

function toast(kind, title, detail) {
  const box = document.createElement("div");
  box.className = "toast toast--" + kind;
  box.innerHTML = ico(kind === "good" ? "check" : kind === "bad" ? "alert" : "info")
    + "<div><b>" + esc(title) + "</b>"
    + (detail ? "<span>" + esc(detail) + "</span>" : "") + "</div>";
  $("#toasts").appendChild(box);
  setTimeout(() => {
    box.style.transition = "opacity .3s ease, transform .3s ease";
    box.style.opacity = "0"; box.style.transform = "translateY(6px)";
    setTimeout(() => box.remove(), 320);
  }, 4200);
}

const Modal = {
  open(title, bodyHTML, footHTML) {
    $("#modal-box").innerHTML =
      '<div class="modal__hd"><h3 id="modal-title">' + esc(title) + '</h3>'
      + '<span style="flex:1"></span>'
      + '<button class="btn btn--ghost" type="button" data-close aria-label="Fermer">' + ico("x") + '</button></div>'
      + '<div class="modal__bd">' + bodyHTML + '</div>'
      + (footHTML ? '<div class="modal__ft">' + footHTML + '</div>' : '');
    $("#modal").dataset.open = "true";
    $$("[data-close]", $("#modal")).forEach(b => b.onclick = () => Modal.close());
    const first = $("input, select, button:not([data-close])", $("#modal-box"));
    if (first) first.focus();
  },
  close() { $("#modal").dataset.open = "false"; $("#modal-box").innerHTML = ""; }
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal").dataset.open === "true") Modal.close();
});
$("#modal").addEventListener("mousedown", e => { if (e.target.id === "modal") Modal.close(); });

/* Pagination : le catalogue partenaires doit la supporter (§3.4). */
function pagerHTML(meta, id) {
  if (meta.pages <= 1) {
    return '<span class="pager__i">' + meta.total + " résultat" + (meta.total > 1 ? "s" : "") + "</span>";
  }
  const btn = (p, lbl, cur, dis) =>
    '<button class="pgbtn" type="button" data-pager="' + id + '" data-page="' + p + '"'
    + (cur ? ' aria-current="true"' : "") + (dis ? " disabled" : "") + ">" + lbl + "</button>";
  let out = '<span class="pager__i">' + meta.total + " résultats · page " + meta.page + " sur " + meta.pages + "</span>";
  out += btn(meta.page - 1, ico("left"), false, meta.page === 1);
  const from = Math.max(1, Math.min(meta.page - 1, meta.pages - 2));
  for (let p = from; p < from + Math.min(3, meta.pages); p++) out += btn(p, p, p === meta.page, false);
  out += btn(meta.page + 1, ico("right"), false, meta.page === meta.pages);
  return out;
}

/* ---- Graphiques -----------------------------------------------------------
   Une seule série par graphique, une seule teinte : ces vues répondent chacune
   à une question de volume, pas à une comparaison de catégories. Les couleurs
   de statut restent réservées aux statuts.
   -------------------------------------------------------------------------*/

const tip = $("#charttip");
function tipShow(html, ev) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y < 8) y = ev.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function tipHide() { tip.style.opacity = "0"; }

function topRounded(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h);
  return "M" + x + " " + (y + h) + "V" + (y + rr)
    + "a" + rr + " " + rr + " 0 0 1 " + rr + " " + -rr
    + "h" + (w - 2 * rr)
    + "a" + rr + " " + rr + " 0 0 1 " + rr + " " + rr
    + "V" + (y + h) + "Z";
}
function endRounded(x, y, w, h, r) {         // barre horizontale : extrémité droite arrondie
  const rr = Math.min(r, h / 2, w);
  return "M" + x + " " + y + "h" + (w - rr)
    + "a" + rr + " " + rr + " 0 0 1 " + rr + " " + rr
    + "v" + (h - 2 * rr)
    + "a" + rr + " " + rr + " 0 0 1 " + -rr + " " + rr
    + "H" + x + "Z";
}
function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}

/* Colonnes : évolution d'un volume dans le temps.

   Le graphique est dessiné APRÈS insertion, aux dimensions réelles de son
   conteneur, en unités pixel. Étirer un viewBox pour remplir la carte
   déformerait aussi les étiquettes : c'est ce qui transforme un axe en titre
   géant. */
const CHARTS = new Map();
let chartSeq = 0;

function chartBox(rows, opts) {
  const id = "ch" + (++chartSeq);
  CHARTS.set(id, { rows: rows, opts: opts || {} });
  return '<div class="chartbox" data-chart="' + id + '" style="height:'
    + ((opts && opts.px) || 190) + 'px"></div>';
}

function mountCharts(root) {
  $$(".chartbox[data-chart]", root || document).forEach(box => {
    const spec = CHARTS.get(box.dataset.chart);
    if (!spec) return;
    box.innerHTML = columnSVG(spec.rows, spec.opts,
      Math.max(220, box.clientWidth || 600), box.clientHeight || spec.opts.px || 190);
  });
}
let resizeT = null;
addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => mountCharts(), 180); });

function columnSVG(rows, opts, W, H) {
  opts = opts || {};
  const padL = 54, padR = 10, padT = 20, padB = 22;
  const max = niceMax(Math.max.apply(null, rows.map(r => r.value).concat([1])));
  const plotW = Math.max(10, W - padL - padR), plotH = Math.max(10, H - padT - padB);
  const band = plotW / rows.length;
  const bw = Math.min(band * 0.6, 24);
  const peak = rows.reduce((a, b) => (b.value > a.value ? b : a), rows[0] || { value: 0 });

  let g = "";
  for (let i = 0; i <= 2; i++) {
    const y = padT + plotH * (i / 2), v = max * (1 - i / 2);
    g += '<line class="grid-l" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '"/>'
      + '<text class="tick tick--v" x="' + (padL - 8) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">'
      + esc(opts.fmtTick ? opts.fmtTick(v) : nfr(Math.round(v))) + "</text>";
  }
  rows.forEach((r, i) => {
    const h = Math.max(1.5, plotH * (r.value / max));
    const x = padL + band * i + (band - bw) / 2, y = padT + plotH - h;
    const isPeak = r === peak && opts.labelPeak !== false && r.value > 0;
    g += '<rect class="hit" x="' + (padL + band * i).toFixed(1) + '" y="' + padT + '" width="' + band.toFixed(1)
      + '" height="' + plotH.toFixed(1) + '" data-tip="'
      + esc(opts.tip ? opts.tip(r) : r.label + " — " + r.value) + '"/>'
      + '<path class="bar' + (isPeak ? " on" : "") + '" d="' + topRounded(x, y, bw, h, 4) + '"/>';
    if (isPeak) {
      g += '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 7).toFixed(1) + '" text-anchor="middle">'
        + esc(opts.fmtPeak ? opts.fmtPeak(r) : nfr(r.value)) + "</text>";
    }
    if (r.tick) {
      g += '<text class="tick" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">'
        + esc(r.tick) + "</text>";
    }
  });
  g += '<line class="axis-l" x1="' + padL + '" y1="' + (padT + plotH).toFixed(1) + '" x2="' + (W - padR)
    + '" y2="' + (padT + plotH).toFixed(1) + '"/>';

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H
    + '" role="img" aria-label="' + esc(opts.aria || "Graphique en colonnes") + '">' + g + "</svg>";
}

/* Barres horizontales : répartition entre entités nommées. */
function barChart(rows, opts) {
  opts = opts || {};
  const max = Math.max.apply(null, rows.map(r => r.value).concat([1]));
  return '<div style="display:flex;flex-direction:column;gap:10px">' + rows.map(r => {
    const pct = Math.max(1.5, (r.value / max) * 100);
    return '<div>'
      + '<div style="display:flex;gap:12px;align-items:baseline;margin-bottom:4px">'
      +   '<span style="font-size:12.5px;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.label) + '</span>'
      +   '<b class="num" style="font-size:12.5px">' + esc(opts.fmt ? opts.fmt(r.value) : nfr(r.value)) + '</b>'
      + '</div>'
      + '<svg class="chart" viewBox="0 0 100 6" preserveAspectRatio="none" style="height:8px" aria-hidden="true">'
      +   '<rect x="0" y="0" width="100" height="6" rx="3" fill="var(--data-wash)"/>'
      +   '<path class="bar" d="' + endRounded(0, 0, pct, 6, 2.4) + '"/>'
      + '</svg></div>';
  }).join("") + "</div>";
}

function sparkline(values, opts) {
  opts = opts || {};
  const W = 100, H = 22, max = Math.max.apply(null, values.concat([1])), min = 0;
  const step = W / Math.max(1, values.length - 1);
  const pt = i => [i * step, H - 2 - (H - 4) * ((values[i] - min) / (max - min || 1))];
  const d = values.map((v, i) => (i ? "L" : "M") + pt(i).map(n => n.toFixed(2)).join(" ")).join("");
  const last = pt(values.length - 1);
  return '<svg class="chart stat__spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" '
    + 'style="height:26px" aria-hidden="true">'
    + '<path d="' + d + "L" + W + " " + H + "L0 " + H + 'Z" fill="var(--data-wash)"/>'
    + '<path d="' + d + '" fill="none" stroke="var(--data)" stroke-width="1.6" stroke-linejoin="round" '
    + 'stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="' + last[0].toFixed(2) + '" cy="' + last[1].toFixed(2) + '" r="2.2" fill="var(--data)" '
    + 'stroke="var(--surface)" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>';
}

/* Un seul écouteur pour toutes les infobulles de graphique. */
document.addEventListener("mouseover", e => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t) tipShow(t.getAttribute("data-tip").replace(/\n/g, "<br>"), e);
});
document.addEventListener("mousemove", e => {
  const t = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (t) tipShow(t.getAttribute("data-tip").replace(/\n/g, "<br>"), e); else tipHide();
});
document.addEventListener("mouseleave", tipHide);

function statTile(label, value, opts) {
  opts = opts || {};
  return '<div class="card stat">'
    + '<div class="stat__lb">' + esc(label) + "</div>"
    + '<div class="stat__v">' + esc(value) + "</div>"
    + (opts.delta ? '<div class="stat__d stat__d--' + (opts.deltaDir || "up") + '">'
        + ico(opts.deltaDir === "down" ? "down" : "up") + "<b>" + esc(opts.delta) + "</b> "
        + esc(opts.deltaNote || "") + "</div>" : "")
    + (opts.note ? '<div class="stat__d">' + esc(opts.note) + "</div>" : "")
    + (opts.spark ? sparkline(opts.spark) : "")
    + "</div>";
}
</script>

<script>
"use strict";
/* ============================================================================
   6. Espace salarié — application mobile

      Rendu dans un châssis de téléphone : c'est là que le dispositif est
      réellement utilisé, au comptoir d'un partenaire, et une maquette pleine
      largeur mentirait sur les contraintes de l'écran.
   ========================================================================= */

const Employee = (function () {

  let view = "accueil";
  let qr = { token: null, expiresAt: 0, timer: null, paid: null };
  let cat = { query: "", category: "", page: 1 };
  let hist = { month: "", page: 1 };

  function frame(inner, tabs) {
    return '<div class="device">'
      + '<div class="device__screen">'
      +   '<div class="device__island" aria-hidden="true"></div>'
      +   '<div class="phone__status"><span class="num">' + heureFR(Date.now()) + '</span>'
      +     '<span class="sigs">' + (DB.degraded
              ? ico("offline") + '<span style="font-size:11px;color:var(--warn)">hors ligne</span>'
              : '<span style="font-size:11px;color:var(--ink-4)">5G</span>') + '</span></div>'
      +   '<div class="phone__body" id="phone-body">' + inner + '</div>'
      +   tabs
      + '</div></div>'
      + '<p class="device__caption">Espace salarié — application mobile · '
      + esc(me().name) + ' · ' + esc(emr(me().employerId).name) + '</p>';
  }

  function tabbar() {
    const t = [["accueil", "home", "Accueil"], ["payer", "qr", "Payer"],
               ["historique", "clock", "Historique"], ["partenaires", "pin", "Autour"]];
    return '<nav class="phone__tabs">' + t.map(([id, i, lb]) =>
      '<button class="ptab" type="button" data-eview="' + id + '"'
      + (view === id ? ' aria-current="true"' : "") + ">" + ico(i) + "<span>" + lb + "</span></button>"
    ).join("") + "</nav>";
  }

  /* ---- Accueil ---------------------------------------------------------- */
  function accueil() {
    const e = me();
    const last = DB.txns.filter(t => t.employeeId === e.id).slice(-4).reverse();
    const lastTop = DB.topups.filter(t => t.employeeId === e.id).sort((a, b) => b.at - a.at)[0];
    const mois = DB.txns.filter(t => t.employeeId === e.id
      && new Date(t.at).getMonth() === new Date().getMonth()).reduce((s, t) => s + t.amount, 0);

    return '<div class="phone__h"><h2>Bonjour ' + esc(e.name.split(" ")[0]) + '</h2></div>'
      + '<div class="paycard">'
      +   '<div class="paycard__top"><div><div class="paycard__brand">CartePro</div>'
      +     '<div class="paycard__min">Ministère du Job et Bonheur</div></div>'
      +     '<div class="paycard__chip" aria-hidden="true"></div></div>'
      +   '<div class="paycard__bal"><div class="lb">Solde disponible</div>'
      +     '<div class="v num" id="emp-balance">' + eur(e.balance) + '</div></div>'
      +   '<div class="paycard__foot"><span class="mono num">'
      +     esc(e.id.replace("SAL-", "4021 ")) + " 88" + '</span>'
      +     '<span style="margin-left:auto">' + esc(emr(e.employerId).name) + "</span></div>"
      + '</div>'
      + '<div class="qbtns">'
      +   '<button class="qbtn" type="button" data-eview="payer">' + ico("qr") + "Payer</button>"
      +   '<button class="qbtn" type="button" data-eview="historique">' + ico("clock") + "Historique</button>"
      +   '<button class="qbtn" type="button" data-eview="partenaires">' + ico("pin") + "Autour</button>"
      + '</div>'
      + '<div style="display:flex;gap:10px;margin-top:16px">'
      +   '<div class="card" style="flex:1;padding:12px 14px">'
      +     '<div style="font-size:11.5px;color:var(--ink-4)">Dépensé ce mois</div>'
      +     '<div class="num" style="font-size:18px;font-weight:600">' + eur(mois) + "</div></div>"
      +   '<div class="card" style="flex:1;padding:12px 14px">'
      +     '<div style="font-size:11.5px;color:var(--ink-4)">Dernière dotation</div>'
      +     '<div class="num" style="font-size:18px;font-weight:600">'
      +       (lastTop ? eur(lastTop.amount) : "—") + "</div>"
      +     '<div style="font-size:11px;color:var(--ink-4)">' + (lastTop ? dateFR(lastTop.at) : "") + "</div></div>"
      + '</div>'
      + '<h3 style="font-size:13px;margin:20px 0 4px">Dernières opérations</h3>'
      + (last.length ? last.map(txnRow).join("") : '<p class="empty">Aucune opération</p>')
      + '<button class="btn btn--ghost" type="button" data-eview="historique" '
      + 'style="width:100%;margin-top:10px">Tout l\'historique</button>';
  }

  function txnRow(t) {
    const p = prt(t.partnerId);
    return '<div class="txnrow"><div class="txnrow__ico">' + ico(catIco(p ? p.category : "store")) + "</div>"
      + '<div class="txnrow__m"><div class="txnrow__t">' + esc(p ? p.name : "Partenaire") + "</div>"
      + '<div class="txnrow__s">' + esc(jourRelatif(t.at)) + " · " + heureFR(t.at) + " · " + esc(t.ref) + "</div></div>"
      + '<div class="txnrow__a num">−' + eur(t.amount) + "</div></div>";
  }

  /* ---- Payer : génération du QR ----------------------------------------- */
  function payer() {
    if (qr.paid) {
      const p = prt(qr.paid.partner.id) || { name: qr.paid.partner.name };
      return '<div class="phone__h"><h2>Paiement accepté</h2></div>'
        + '<div class="paid"><div class="paid__mark">' + ico("check") + "</div>"
        + '<div><div class="num" style="font-size:32px;font-weight:600">−' + eur(qr.paid.amount) + "</div>"
        + '<div style="color:var(--ink-3);margin-top:4px">' + esc(p.name) + "</div></div>"
        + '<div class="card" style="width:100%;padding:14px;text-align:left">'
        +   row("Référence", '<span class="mono">' + esc(qr.paid.ref) + "</span>")
        +   row("Nouveau solde", '<b class="num">' + eur(me().balance) + "</b>")
        +   row("Empreinte", '<span class="mono" style="font-size:11px">' + esc(qr.paid.hash) + "</span>")
        + "</div>"
        + '<p style="font-size:12px;color:var(--ink-4);max-width:30ch">Cette opération est définitive : '
        + 'elle ne peut être ni modifiée ni annulée.</p>'
        + '<button class="btn btn--primary btn--lg" type="button" data-qr="reset">Terminer</button></div>';
    }

    const live = qr.token && qr.expiresAt > Date.now();
    return '<div class="phone__h"><h2>Payer</h2></div>'
      + (DB.degraded ? '<div class="note note--warn" style="margin-bottom:14px">' + ico("offline")
          + "<div><b>Mode dégradé.</b> Le jeton est produit par l'application à partir de la réserve "
          + "pré-provisionnée. Il reste présentable ; le partenaire l'encaissera puis synchronisera.</div></div>" : "")
      + '<div class="qrstage">'
      +   '<div class="qrframe' + (live ? "" : " qrframe--dead") + '" id="qr-frame">'
      +     '<canvas id="qr-canvas" width="232" height="232" role="img" '
      +     'aria-label="QR code de paiement à présenter au partenaire"></canvas>'
      +     '<div class="qrframe__over"><div><div style="font-weight:600;margin-bottom:6px">'
      +       (qr.token ? "Jeton expiré" : "Aucun jeton actif") + "</div>"
      +       '<div style="font-size:12px;color:var(--ink-3)">Générez un QR code au moment de payer.</div></div></div>'
      +   "</div>"
      +   (live ? '<div class="qrtimer">'
      +     '<svg class="qrtimer__ring" viewBox="0 0 36 36" aria-hidden="true">'
      +       '<circle cx="18" cy="18" r="15" fill="none" stroke="var(--surface-3)" stroke-width="3"/>'
      +       '<circle id="qr-ring" cx="18" cy="18" r="15" fill="none" stroke="var(--brand)" stroke-width="3" '
      +       'stroke-linecap="round" transform="rotate(-90 18 18)" stroke-dasharray="94.2" stroke-dashoffset="0"/></svg>'
      +     '<div style="text-align:left"><div class="qrtimer__t" id="qr-time">5:00</div>'
      +     '<div class="qrtimer__s">avant expiration · usage unique</div></div></div>' : "")
      +   (qr.token ? '<div class="qrtoken">CP1|' + esc(qr.token) + "</div>" : "")
      +   '<button class="btn ' + (live ? "" : "btn--primary ") + 'btn--lg" type="button" data-qr="new" '
      +     'style="margin-top:16px">' + (live ? "Régénérer un jeton" : "Générer un QR code de paiement") + "</button>"
      +   '<p style="font-size:11.5px;color:var(--ink-4);margin-top:12px;max-width:34ch;text-align:center">'
      +     "Le partenaire scanne ce code, saisit le montant et valide. Votre solde est débité à cet instant.</p>"
      + "</div>";
  }
  const row = (k, v) => '<div style="display:flex;gap:12px;padding:5px 0;font-size:12.5px">'
    + '<span style="color:var(--ink-4)">' + k + '</span><span style="margin-left:auto">' + v + "</span></div>";

  async function newToken() {
    try {
      const t = await API.post("/payment-tokens", { employeeId: me().id });
      qr.token = t.token; qr.expiresAt = t.expiresAt; qr.paid = null;
      render();
      toast("info", "Jeton émis", "Valable 5 minutes, un seul encaissement.");
    } catch (e) {
      toast("bad", "Émission impossible", (e.body && e.body.message) || "Erreur");
    }
  }

  function tick() {
    if (!qr.token || view !== "payer" || qr.paid) return;
    const left = qr.expiresAt - Date.now();
    const el = $("#qr-time"), ring = $("#qr-ring");
    if (left <= 0) { render(); return; }
    if (el) el.textContent = Math.floor(left / 60000) + ":" + pad(Math.floor(left / 1000) % 60);
    if (ring) ring.setAttribute("stroke-dashoffset", String(94.2 * (1 - left / (5 * 60e3))));
  }

  /* ---- Historique ------------------------------------------------------- */
  async function historique() {
    const e = me();
    const res = await API.get("/employees/" + e.id + "/transactions",
      Object.assign({ page: hist.page, size: 8 }, hist.month ? { month: hist.month } : {}));
    const months = [];
    for (let i = 0; i < 4; i++) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      months.push({ v: d.toISOString().slice(0, 7), lb: M_COURT[d.getMonth()] + " " + String(d.getFullYear()).slice(2) });
    }
    const total = res.items.reduce((s, t) => s + t.amount, 0);

    return '<div class="phone__h"><h2>Historique</h2></div>'
      + '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px">'
      +   '<button class="pgbtn" type="button" data-month=""' + (hist.month ? "" : ' aria-current="true"') + ">Tout</button>"
      +   months.map(m => '<button class="pgbtn" type="button" data-month="' + m.v + '"'
          + (hist.month === m.v ? ' aria-current="true"' : "") + ">" + m.lb + "</button>").join("")
      + "</div>"
      + '<div class="card" style="padding:12px 14px;margin-bottom:6px;display:flex;align-items:baseline">'
      +   '<span style="font-size:12px;color:var(--ink-3)">' + res.total + " opération" + (res.total > 1 ? "s" : "") + "</span>"
      +   '<b class="num" style="margin-left:auto">' + eur(total) + "</b>"
      +   '<span style="font-size:11px;color:var(--ink-4);margin-left:6px">sur cette page</span></div>'
      + (res.items.length ? res.items.map(t => {
          return '<div class="txnrow"><div class="txnrow__ico">'
            + ico(catIco(t.partner ? t.partner.category : "store")) + "</div>"
            + '<div class="txnrow__m"><div class="txnrow__t">' + esc(t.partner ? t.partner.name : "—") + "</div>"
            + '<div class="txnrow__s">' + esc(dateFR(new Date(t.at).getTime())) + " · " + esc(t.ref) + "</div></div>"
            + '<div class="txnrow__a num">−' + eur(t.amount) + "</div></div>";
        }).join("") : '<p class="empty">Aucune opération sur cette période</p>')
      + '<div class="pager" style="margin-top:14px">' + pagerHTML(res, "hist") + "</div>";
  }

  /* ---- Partenaires ------------------------------------------------------ */
  async function partenaires() {
    const res = await API.get("/partners", { page: cat.page, size: 6,
      query: cat.query, category: cat.category });
    const all = await API.get("/partners", { size: 100 });

    return '<div class="phone__h"><h2>Autour de moi</h2></div>'
      + '<label class="field" style="margin-bottom:10px">'
      +   '<span class="vh">Rechercher un partenaire</span>'
      +   '<input class="input" id="cat-q" type="search" placeholder="Rechercher un partenaire, une ville…" '
      +   'value="' + esc(cat.query) + '"></label>'
      + '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px">'
      +   '<button class="pgbtn" type="button" data-cat=""' + (cat.category ? "" : ' aria-current="true"') + ">Toutes</button>"
      +   CATEGORIES.map(c => '<button class="pgbtn" type="button" data-cat="' + c.id + '"'
          + (cat.category === c.id ? ' aria-current="true"' : "") + ">" + esc(c.label) + "</button>").join("")
      + "</div>"
      + mapHTML(all.items, 100, 62)
      + '<div class="plist" style="margin-top:6px">'
      + (res.items.length ? res.items.map(p =>
          '<button class="pitem" type="button" data-partner="' + p.id + '">'
          + '<span class="pitem__ico">' + ico(catIco(p.category)) + "</span>"
          + '<span class="pitem__m"><span class="pitem__t">' + esc(p.name) + "</span>"
          + '<span class="pitem__s">' + esc(p.categoryLabel) + " · " + esc(p.city) + "</span></span>"
          + '<span class="pitem__d">' + (0.3 + (p.x + p.y)).toFixed(1) + " km</span></button>"
        ).join("") : '<p class="empty">Aucun partenaire ne correspond</p>')
      + "</div>"
      + '<div class="pager" style="margin-top:14px">' + pagerHTML(res, "cat") + "</div>";
  }

  /* Fond de plan schématique : le dispositif n'embarque pas de service
     cartographique, mais la fonction « localiser un partenaire » doit être
     démontrable. Les rues sont dessinées, les positions sont réelles. */
  function mapHTML(items, W, H) {
    const streets = [[0,14,100,20],[0,38,100,31],[0,52,100,58],[18,0,26,62],[52,0,46,62],[76,0,84,62]];
    return '<div class="mapbox"><svg viewBox="0 0 ' + W + " " + H + '" role="img" '
      + 'aria-label="Plan des partenaires référencés">'
      + '<rect width="' + W + '" height="' + H + '" fill="#e9eef7"/>'
      + '<rect x="6" y="20" width="20" height="14" rx="2" fill="#dcecdd"/>'
      + '<rect x="62" y="6" width="26" height="10" rx="2" fill="#dcecdd"/>'
      + '<path d="M0 46 C 20 42, 30 54, 52 50 S 84 40, 100 44" fill="none" stroke="#cfe0f3" stroke-width="4"/>'
      + streets.map(s => '<line x1="' + s[0] + '" y1="' + s[1] + '" x2="' + s[2] + '" y2="' + s[3]
          + '" stroke="#ffffff" stroke-width="2.4"/>').join("")
      + items.map(p => {
          const x = (6 + p.x * 88).toFixed(1), y = (5 + p.y * 52).toFixed(1);
          return '<g class="mappin" data-partner="' + p.id + '" data-tip="' + esc(p.name + " — " + p.city) + '">'
            + '<circle class="hit" cx="' + x + '" cy="' + y + '" r="4.5"/>'
            + '<circle cx="' + x + '" cy="' + y + '" r="2.6" fill="#000091" stroke="#fff" stroke-width="1"/></g>';
        }).join("")
      + "</svg><div class=\"maplegend\">" + items.length + " partenaires référencés</div></div>";
  }

  /* ---- Assemblage ------------------------------------------------------- */
  async function render() {
    const body = view === "accueil" ? accueil()
      : view === "payer" ? payer()
      : view === "historique" ? await historique()
      : await partenaires();
    $("#app").innerHTML = '<div class="workspace" style="grid-template-columns:minmax(0,1fr)">'
      + '<div class="stage stage--bench">' + frame(body, tabbar()) + "</div></div>";
    if (view === "payer" && qr.token && qr.expiresAt > Date.now()) {
      try { QR.draw($("#qr-canvas"), "CP1|" + qr.token, 232); }
      catch (e) { toast("bad", "QR indisponible", e.message); }
      tick();
    }
    const q = $("#cat-q");
    if (q) {
      q.oninput = () => { cat.query = q.value; cat.page = 1;
        clearTimeout(q._t); q._t = setTimeout(() => { render().then(() => { const n = $("#cat-q"); if (n) { n.focus(); n.selectionStart = n.value.length; } }); }, 220); };
    }
  }

  function go(v) { view = v; if (v !== "payer") qr.paid = null; render(); }

  BUS.on("txn", d => {
    if (d.employee.id !== DB.session.employeeId) return;
    if (qr.token && DB.tokens.some(t => t.token === qr.token && t.usedAt)) {
      qr.paid = { amount: d.txn.amount, ref: d.txn.ref, hash: d.txn.hash,
                  partner: { id: d.partner.id, name: d.partner.name } };
      qr.token = null;
      if (DB.session.role === "employee") { view = "payer"; render(); }
    }
  });

  setInterval(tick, 500);

  return {
    render, go,
    handle(el) {
      if (el.dataset.eview) { go(el.dataset.eview); return true; }
      if (el.dataset.qr === "new") { newToken(); return true; }
      if (el.dataset.qr === "reset") { qr.paid = null; go("accueil"); return true; }
      if (el.dataset.month !== undefined && el.closest(".phone__body")) {
        hist.month = el.dataset.month; hist.page = 1; render(); return true;
      }
      if (el.dataset.cat !== undefined) { cat.category = el.dataset.cat; cat.page = 1; render(); return true; }
      if (el.dataset.pager === "hist") { hist.page = Number(el.dataset.page); render(); return true; }
      if (el.dataset.pager === "cat") { cat.page = Number(el.dataset.page); render(); return true; }
      if (el.dataset.partner && el.closest(".stage--bench")) { partnerSheet(el.dataset.partner); return true; }
      return false;
    },
    reset() { view = "accueil"; qr = { token: null, expiresAt: 0, timer: null, paid: null }; }
  };

  async function partnerSheet(id) {
    const p = await API.get("/partners/" + id);
    Modal.open(p.name,
      '<div style="display:flex;gap:14px;align-items:flex-start">'
      + '<div class="pitem__ico" style="width:46px;height:46px">' + ico(catIco(p.category)) + "</div>"
      + "<div><div style=\"font-weight:600\">" + esc(p.categoryLabel) + "</div>"
      + '<div style="color:var(--ink-3);font-size:13px">' + esc(p.address) + ", " + esc(p.city) + "</div>"
      + '<div style="margin-top:8px"><span class="pill ' + STATUS[p.status].pill + '">'
      + STATUS[p.status].label + "</span></div></div></div>"
      + '<hr class="sep">'
      + '<div class="note">' + ico("info") + "<div>Présentez votre QR code CartePro en caisse. "
      + "Le partenaire saisit le montant, vous voyez le débit immédiatement.</div></div>",
