      '<button class="btn" type="button" data-close>Fermer</button>');
  }
})();
</script>

<script>
"use strict";
/* ============================================================================
   7. Espace partenaire
   ========================================================================= */

const Partner = (function () {

  let view = "bord";
  let scan = { token: null, employee: null, amount: "", busy: false };
  let period = 30;
  let cat = { page: 1, query: "" };

  const NAV = [
    ["bord",         "chart",  "Tableau de bord"],
    ["encaisser",    "scan",   "Encaisser"],
    ["transactions", "list",   "Transactions"],
    ["catalogue",    "store",  "Catalogue"],
    ["compte",       "build",  "Mon compte"]
  ];

  function rail() {
    const p = mypartner();
    const outbox = DB.outbox.length;
    return '<aside class="rail"><div class="rail__group">'
      + '<p class="rail__label">Espace partenaire</p>'
      + NAV.map(([id, i, lb]) =>
          '<button class="navitem" type="button" data-pview="' + id + '"'
          + (view === id ? ' aria-current="true"' : "") + ">"
          + '<span class="navitem__ico">' + ico(i) + "</span>" + lb
          + (id === "encaisser" && outbox ? '<span class="navitem__badge">' + outbox + "</span>" : "")
          + "</button>").join("")
      + "</div>"
      + '<div class="rail__group"><p class="rail__label">Établissement</p>'
      + '<div style="padding:0 10px"><div style="font-weight:600;font-size:13px">' + esc(p.name) + "</div>"
      + '<div style="font-size:11.5px;color:var(--ink-4);margin-bottom:8px">' + esc(p.city) + "</div>"
      + '<span class="pill ' + STATUS[p.status].pill + '">' + STATUS[p.status].label + "</span></div></div>"
      + "</aside>";
  }

  /* ---- Tableau de bord -------------------------------------------------- */
  async function bord() {
    const p = mypartner();
    const now = Date.now(), d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const mine = DB.txns.filter(t => t.partnerId === p.id);
    const today = mine.filter(t => t.at >= d0.getTime());
    const m30 = mine.filter(t => t.at >= now - 30 * 864e5);
    const m60 = mine.filter(t => t.at >= now - 60 * 864e5 && t.at < now - 30 * 864e5);
    const sum = a => a.reduce((s, t) => s + t.amount, 0);
    const evol = sum(m60) ? Math.round((sum(m30) - sum(m60)) / sum(m60) * 100) : 0;

    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(now - i * 864e5); d.setHours(0, 0, 0, 0);
      const next = d.getTime() + 864e5;
      const rows = mine.filter(t => t.at >= d.getTime() && t.at < next);
      days.push({ label: dateFR(d.getTime()), value: sum(rows), count: rows.length,
                  tick: i % 3 === 0 ? d.getDate() + "/" + (d.getMonth() + 1) : "" });
    }
    const spark = days.slice(-12).map(d => d.value / 100);

    return '<div class="pagehead"><div><h1>Tableau de bord</h1>'
      + '<p>Encaissements CartePro de ' + esc(p.name) + ". Les montants sont crédités sur le compte "
      + "de l'établissement à J+2 ouvré.</p></div>"
      + '<div class="pagehead__act">'
      + '<button class="btn btn--primary" type="button" data-pview="encaisser">' + ico("scan") + "Encaisser</button>"
      + "</div></div>"
      + '<div class="grid g-4" style="margin-bottom:16px">'
      + statTile("Encaissé aujourd'hui", eur(sum(today)), { note: today.length + " transaction" + (today.length > 1 ? "s" : "") })
      + statTile("Encaissé sur 30 jours", eur(sum(m30)), {
          delta: (evol >= 0 ? "+" : "") + evol + " %", deltaDir: evol >= 0 ? "up" : "down",
          deltaNote: "vs 30 jours précédents" })
      + statTile("Transactions (30 j)", nfr(m30.length), { spark })
      + statTile("Panier moyen", m30.length ? eur(Math.round(sum(m30) / m30.length)) : "—",
          { note: "sur les 30 derniers jours" })
      + "</div>"
      + '<div class="grid g-main">'
      + '<section class="card"><div class="card__hd"><h3>Encaissements des 14 derniers jours</h3>'
      +   '<span class="sub">en euros</span>'
      +   '<span class="act"><button class="btn btn--ghost" type="button" data-table="p14">Données</button></span></div>'
      +   '<div class="card__bd">' + chartBox(days, {
            px: 210, aria: "Encaissements quotidiens des quatorze derniers jours",
            fmtTick: v => eurShort(v),
            fmtPeak: r => eurShort(r.value),
            tip: r => r.label + "\n" + eur(r.value) + " · " + r.count + " transaction" + (r.count > 1 ? "s" : "")
          }) + "</div></section>"
      + '<section class="card"><div class="card__hd"><h3>Derniers encaissements</h3></div>'
      +   '<div class="card__bd" style="padding:8px 0">'
      +   (mine.length ? mine.slice(-6).reverse().map(t => {
            const e = emp(t.employeeId);
            return '<div class="txnrow" style="padding:9px 18px">'
              + '<div class="txnrow__ico txnrow__ico--in">' + ico("down") + "</div>"
              + '<div class="txnrow__m"><div class="txnrow__t">' + esc(e ? e.name : "Salarié") + "</div>"
              + '<div class="txnrow__s">' + esc(jourRelatif(t.at)) + " · " + heureFR(t.at) + " · <span class=\"mono\">" + esc(t.ref) + "</span></div></div>"
              + '<div class="txnrow__a txnrow__a--in num">+' + eur(t.amount) + "</div></div>";
          }).join("") : '<p class="empty">Aucun encaissement</p>')
      +   "</div>"
      +   '<div class="card__ft">Total historique : <b class="num">' + eur(sum(mine)) + "</b> sur "
      +   mine.length + " transactions</div></section>"
      + "</div>";
  }

  /* ---- Encaisser -------------------------------------------------------- */
  function encaisser() {
    const p = mypartner();
    if (p.status !== "active") {
      return '<div class="pagehead"><div><h1>Encaisser</h1></div></div>'
        + '<div class="card"><div class="card__bd"><div class="note note--warn">' + ico("alert")
        + "<div><b>Compte " + STATUS[p.status].label.toLowerCase() + ".</b> "
        + "Un établissement non actif ne peut pas encaisser. Contactez la Direction du Numérique "
        + "et de l'Innovation pour connaître les suites données à votre dossier.</div></div></div></div>";
    }

    const out = DB.outbox.length ? '<section class="card" style="margin-top:16px">'
      + '<div class="card__hd"><h3>File d\'attente hors ligne</h3>'
      + '<span class="sub">' + DB.outbox.length + " encaissement" + (DB.outbox.length > 1 ? "s" : "") + " capturé" + (DB.outbox.length > 1 ? "s" : "") + " sans réseau</span>"
      + '<span class="act"><button class="btn btn--primary" type="button" data-sync="1"'
      + (DB.degraded ? " disabled" : "") + ">" + ico("refresh") + "Synchroniser</button></span></div>"
      + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Capturé le</th><th>Jeton</th>'
      + '<th class="r">Montant</th><th>État</th></tr></thead><tbody>'
      + DB.outbox.map(o => '<tr><td class="num">' + dateFR(o.capturedAt, true) + "</td>"
          + '<td class="mono">' + esc(o.token.slice(0, 10)) + "…</td>"
          + '<td class="r num">' + eur(o.amount) + "</td>"
          + '<td><span class="pill ' + (o.error ? "pill--crit" : "pill--warn") + '">'
          + esc(o.error || "En attente") + "</span></td></tr>").join("")
      + "</tbody></table></div>"
      + '<div class="card__ft">' + (DB.degraded
          ? "La synchronisation reprendra à la reconnexion. Les jetons restent valides : c'est la date "
            + "de capture qui fait foi."
          : "Réseau disponible — lancez la synchronisation pour écrire ces opérations au registre.")
      + "</div></section>" : "";

    return '<div class="pagehead"><div><h1>Encaisser un paiement</h1>'
      + "<p>Scannez le QR code présenté par le salarié, ou saisissez son jeton à la main si la caméra "
      + "est indisponible.</p></div></div>"
      + '<div class="grid g-main">'
      + '<section class="card"><div class="card__bd">'
      +   (DB.degraded ? '<div class="note note--warn" style="margin-bottom:16px">' + ico("offline")
          + "<div><b>Mode dégradé actif.</b> L'encaissement sera capturé localement, signé, puis "
          + "transmis au registre dès le retour du réseau.</div></div>" : "")
      +   '<div class="grid g-2">'
      +     '<div><span class="field__lb">1. Jeton du salarié</span>'
      +       (scan.token
              ? '<div class="card" style="padding:14px;background:var(--good-wash);border-color:#c6e8c6">'
                + '<div style="display:flex;align-items:center;gap:10px">'
                + '<span style="color:#0a7a0a">' + ico("check") + "</span>"
                + "<div><b>" + esc(scan.employee.name) + "</b>"
                + '<div class="mono" style="font-size:11.5px;color:var(--ink-3)">CP1|' + esc(scan.token) + "</div></div></div></div>"
              : '<div style="display:flex;gap:8px;flex-wrap:wrap">'
                + '<button class="btn btn--primary" type="button" data-scan="cam">' + ico("scan") + "Scanner le QR</button>"
                + '<button class="btn" type="button" data-scan="man">Saisie manuelle</button></div>')
      +     "</div>"
      +     '<div><label class="field"><span class="field__lb">2. Montant à encaisser</span>'
      +       '<input class="input input--big num" id="pay-amount" type="text" inputmode="decimal" '
      +       'placeholder="0,00" value="' + esc(scan.amount) + '"' + (scan.token ? "" : " disabled") + ">"
      +       '<span class="field__hint">En euros. Le solde du salarié est débité immédiatement.</span></label></div>'
      +   "</div>"
      +   '<hr class="sep">'
      +   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
      +     '<button class="btn btn--primary btn--lg" type="button" data-scan="validate" style="width:auto"'
      +     (scan.token ? "" : " disabled") + ">" + ico("check") + "Valider l'encaissement</button>"
      +     '<button class="btn btn--ghost" type="button" data-scan="cancel">Annuler</button>'
      +     '<span style="font-size:12px;color:var(--ink-4);margin-left:auto">'
      +     "Une transaction validée est définitive (§2.2).</span>"
      +   "</div>"
      + "</div></section>"
      + '<section class="card"><div class="card__hd"><h3>Comment ça marche</h3></div>'
      +   '<div class="card__bd" style="display:flex;flex-direction:column;gap:14px">'
      +   [["Le salarié génère un QR", "Valable 5 minutes, utilisable une seule fois."],
          ["Vous scannez et saisissez le montant", "Le jeton identifie le salarié, jamais sa carte bancaire."],
          ["La validation débite le solde", "Le salarié voit le nouveau solde à l'instant même."],
          ["L'écriture est définitive", "Chaque transaction est chaînée à la précédente par une empreinte."]
        ].map((s, i) => '<div style="display:flex;gap:12px">'
          + '<span style="width:22px;height:22px;border-radius:50%;background:var(--brand-wash);color:var(--brand);'
          + 'display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none">' + (i + 1) + "</span>"
          + "<div><b style=\"font-size:13px\">" + s[0] + "</b>"
          + '<div style="font-size:12.5px;color:var(--ink-3)">' + s[1] + "</div></div></div>").join("")
      +   "</div></section>"
      + "</div>" + out;
  }

  async function doScan() {
    Modal.open("Scanner le QR code",
      '<div style="display:grid;place-items:center;gap:14px;padding:10px 0">'
      + '<div style="width:210px;height:210px;border-radius:14px;background:var(--ink);position:relative;'
      + 'display:grid;place-items:center;color:#5c6480">' + ico("scan")
      + '<div style="position:absolute;left:14px;right:14px;height:2px;background:var(--good);'
      + 'animation:scanline 1.1s ease-in-out infinite alternate"></div></div>'
      + '<p style="font-size:13px;color:var(--ink-3)">Recherche d\'un QR code CartePro…</p></div>'
      + '<style>@keyframes scanline{from{top:18px}to{top:190px}}</style>');
    await new Promise(r => setTimeout(r, 1250));
    const t = DB.tokens.filter(x => !x.usedAt && x.expiresAt > Date.now()).slice(-1)[0];
    Modal.close();
    if (!t) {
      toast("bad", "Aucun QR détecté", "Demandez au salarié de générer un jeton dans son application.");
      return;
    }
    await resolve(t.token);
  }

  async function resolve(token) {
    try {
      const r = await API.get("/payment-tokens/" + token);
      scan.token = r.token; scan.employee = r.employee;
      render();
      toast("good", "Jeton reconnu", r.employee.name);
    } catch (e) {
      if (e.network) {
        // Hors ligne : le jeton est accepté sur sa seule présentation et sera
        // vérifié à la synchronisation.
        scan.token = token; scan.employee = { name: "Salarié (vérification différée)" };
        render();
        toast("info", "Capturé hors ligne", "Le jeton sera vérifié à la reconnexion.");
      } else {
        toast("bad", "Jeton refusé", (e.body && e.body.message) || "Erreur");
      }
    }
  }

  async function validate() {
    const raw = ($("#pay-amount") || {}).value || "";
    const amount = Math.round(parseFloat(raw.replace(/\s/g, "").replace(",", ".")) * 100);
    if (!(amount > 0)) { toast("bad", "Montant invalide", "Saisissez un montant supérieur à zéro."); return; }
    const capturedAt = Date.now();
    try {
      const t = await API.post("/transactions", { token: scan.token, partnerId: mypartner().id,
        amount, capturedAt, channel: "qr" });
      scan = { token: null, employee: null, amount: "" };
      render();
      toast("good", "Encaissement validé", t.ref + " · " + eur(t.amount));
    } catch (e) {
      if (e.network) {
        DB.outbox.push({ token: scan.token, amount, capturedAt, partnerId: mypartner().id });
        save();
        scan = { token: null, employee: null, amount: "" };
        render();
        toast("info", "Mis en file d'attente", "Sera transmis dès le retour du réseau.");
      } else {
        toast("bad", "Encaissement refusé", (e.body && e.body.message) || "Erreur");
      }
    }
  }

  async function sync() {
    const items = DB.outbox.slice();
    DB.outbox.length = 0;
    let ok = 0;
    for (const o of items) {
      try {
        await API.post("/transactions", { token: o.token, partnerId: o.partnerId,
          amount: o.amount, capturedAt: o.capturedAt, channel: "offline" });
        ok++;
      } catch (e) {
        o.error = (e.body && e.body.message) || "Échec";
        DB.outbox.push(o);
      }
    }
    save(); render();
    if (ok) toast("good", "Synchronisation terminée", ok + " encaissement" + (ok > 1 ? "s" : "") + " transmis.");
    if (DB.outbox.length) toast("bad", "Reste " + DB.outbox.length + " en échec", "Voir la file d'attente.");
  }

  /* ---- Transactions ----------------------------------------------------- */
  async function transactions() {
    const p = mypartner();
    const since = Date.now() - period * 864e5;
    const res = await API.get("/partners/" + p.id + "/transactions", { since, page: cat.page, size: 12 });
    const total = DB.txns.filter(t => t.partnerId === p.id && t.at >= since).reduce((s, t) => s + t.amount, 0);

    return '<div class="pagehead"><div><h1>Transactions</h1>'
      + "<p>Journal des encaissements. Chaque ligne porte l'empreinte qui la relie à la précédente.</p></div>"
      + '<div class="pagehead__act">'
      + [7, 30, 90].map(d => '<button class="pgbtn" type="button" data-period="' + d + '"'
          + (period === d ? ' aria-current="true"' : "") + ">" + d + " j</button>").join("")
      + '<button class="btn" type="button" data-export="1">' + ico("dl") + "Exporter</button></div></div>"
      + '<div class="grid g-3" style="margin-bottom:16px">'
      + statTile("Encaissé sur la période", eur(total))
      + statTile("Transactions", nfr(res.total))
      + statTile("Panier moyen", res.total ? eur(Math.round(total / res.total)) : "—")
      + "</div>"
      + '<section class="card"><div class="tblwrap"><table class="tbl"><thead><tr>'
      +   "<th>Référence</th><th>Date</th><th>Salarié</th><th>Canal</th>"
      +   '<th class="r">Montant</th><th>Empreinte</th><th>État</th></tr></thead><tbody>'
      + (res.items.length ? res.items.map(t =>
          "<tr><td class=\"mono\">" + esc(t.ref) + "</td>"
          + '<td class="num">' + dateFR(new Date(t.at).getTime(), true) + "</td>"
          + "<td>" + esc(t.employee ? t.employee.name : "—") + "</td>"
          + "<td>" + (t.channel === "offline" ? '<span class="pill pill--mute">Hors ligne</span>' : '<span class="pill pill--info">QR</span>') + "</td>"
          + '<td class="r num"><b>' + eur(t.amount) + "</b></td>"
          + '<td class="mono" style="font-size:11.5px;color:var(--ink-4)">' + esc(t.integrity.hash) + "</td>"
          + '<td><span class="pill pill--good">Validée</span></td></tr>').join("")
        : '<tr><td colspan="7"><p class="empty">Aucune transaction sur la période</p></td></tr>')
      + "</tbody></table></div>"
      + '<div class="card__ft"><div class="pager">' + pagerHTML(res, "ptx") + "</div></div></section>";
  }

  /* ---- Catalogue -------------------------------------------------------- */
  async function catalogue() {
    const res = await API.get("/partners", { page: cat.page, size: 8, query: cat.query });
    return '<div class="pagehead"><div><h1>Catalogue des partenaires</h1>'
      + "<p>Les établissements référencés par le Ministère. La liste est paginée : elle est appelée "
      + "à s'allonger (§3.4).</p></div></div>"
      + '<section class="card"><div class="card__hd">'
      + '<input class="input" id="pcat-q" type="search" placeholder="Rechercher…" style="max-width:280px" value="'
      + esc(cat.query) + '"><span class="sub">' + res.total + " établissements actifs</span></div>"
      + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Établissement</th><th>Catégorie</th>'
      + "<th>Ville</th><th>Région</th></tr></thead><tbody>"
      + res.items.map(p => "<tr><td><b>" + esc(p.name) + "</b><div style=\"font-size:11.5px;color:var(--ink-4)\">"
          + esc(p.address) + "</div></td><td>" + esc(p.categoryLabel) + "</td><td>" + esc(p.city)
          + '</td><td style="color:var(--ink-3)">' + esc(p.region) + "</td></tr>").join("")
      + "</tbody></table></div>"
      + '<div class="card__ft"><div class="pager">' + pagerHTML(res, "pcat") + "</div></div></section>";
  }

  /* ---- Compte ----------------------------------------------------------- */
  async function compte() {
    const p = await API.get("/partners/" + DB.session.partnerId);
    const pend = DB.partners.filter(x => x.status === "pending");
    const line = (k, v) => '<div style="display:flex;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)">'
      + '<span style="color:var(--ink-3);min-width:150px">' + k + "</span><span>" + v + "</span></div>";

    return '<div class="pagehead"><div><h1>Mon compte</h1>'
      + "<p>Coordonnées de l'établissement et suivi des demandes d'adhésion.</p></div>"
      + '<div class="pagehead__act"><button class="btn btn--primary" type="button" data-new-partner="1">'
      + ico("plus") + "Déposer une demande d'adhésion</button></div></div>"
      + '<div class="grid g-main">'
      + '<section class="card"><div class="card__hd"><h3>' + esc(p.name) + "</h3>"
      +   '<span class="act"><span class="pill ' + STATUS[p.status].pill + '">' + STATUS[p.status].label + "</span></span></div>"
      +   '<div class="card__bd" style="padding-top:4px">'
      +   line("Identifiant", '<span class="mono">' + esc(p.id) + "</span>")
      +   line("Catégorie", esc(p.categoryLabel))
      +   line("Adresse", esc(p.address + ", " + p.city))
      +   line("Région", esc(p.region))
      +   line("SIRET", '<span class="mono">' + esc(p.siret) + "</span>")
      +   line("IBAN de reversement", '<span class="mono">' + esc(p.iban) + "</span>")
      +   line("Référencé depuis", dateFR(new Date(p.createdAt).getTime()))
      +   line("Encaissements", "<b>" + eur(p.totals.amount) + "</b> sur " + p.totals.count + " transactions")
      +   "</div></section>"
      + '<section class="card"><div class="card__hd"><h3>Demandes en cours d\'instruction</h3></div>'
      +   '<div class="card__bd">'
      +   (pend.length ? pend.map(x => '<div style="display:flex;gap:12px;align-items:center;padding:9px 0;'
          + 'border-bottom:1px solid var(--line)"><div><b>' + esc(x.name) + "</b>"
          + '<div style="font-size:12px;color:var(--ink-4)">Déposée le ' + dateFR(x.createdAt) + "</div></div>"
          + '<span class="pill pill--warn" style="margin-left:auto">En attente</span></div>').join("")
          : '<p class="empty">Aucune demande en cours</p>')
      +   '<div class="note" style="margin-top:14px">' + ico("info")
      +   "<div>Toute adhésion est soumise à une validation manuelle par l'administration (§2.2). "
      +   "Aucun encaissement n'est possible avant cette validation.</div></div>"
      +   "</div></section></div>";
  }

  function newPartnerForm() {
    Modal.open("Demande d'adhésion au dispositif",
      '<label class="field"><span class="field__lb">Raison sociale</span>'
      + '<input class="input" id="np-name" placeholder="Ex. Boulangerie du Marché"></label>'
      + '<div class="grid g-2">'
      + '<label class="field"><span class="field__lb">Catégorie</span><select class="select" id="np-cat">'
      + CATEGORIES.map(c => '<option value="' + c.id + '">' + esc(c.label) + "</option>").join("")
      + "</select></label>"
      + '<label class="field"><span class="field__lb">Région</span><select class="select" id="np-reg">'
      + REGIONS.map(r => '<option>' + esc(r) + "</option>").join("") + "</select></label></div>"
      + '<div class="grid g-2">'
      + '<label class="field"><span class="field__lb">Adresse</span><input class="input" id="np-addr" placeholder="12 rue…"></label>'
      + '<label class="field"><span class="field__lb">Ville</span><input class="input" id="np-city" placeholder="Paris"></label></div>'
      + '<div class="grid g-2">'
      + '<label class="field"><span class="field__lb">SIRET</span><input class="input mono" id="np-siret" placeholder="000 000 000 00000"></label>'
      + '<label class="field"><span class="field__lb">Courriel de contact</span><input class="input" id="np-mail" type="email" placeholder="contact@etablissement.fr"></label></div>'
      + '<div class="note">' + ico("lock") + "<div>La demande est transmise à la Direction du Numérique "
      + "et de l'Innovation. Elle sera instruite manuellement avant activation.</div></div>",
      '<button class="btn" type="button" data-close>Annuler</button>'
      + '<button class="btn btn--primary" type="button" data-submit-partner="1">Transmettre la demande</button>');
  }

  async function submitPartner() {
    const v = id => ($("#" + id) || {}).value || "";
    if (!v("np-name").trim() || !v("np-city").trim()) {
      toast("bad", "Formulaire incomplet", "La raison sociale et la ville sont obligatoires.");
      return;
    }
    try {
      const p = await API.post("/partners", {
        name: v("np-name").trim(), category: v("np-cat"), region: v("np-reg"),
        address: v("np-addr").trim(), city: v("np-city").trim(),
        siret: v("np-siret").trim(), contact: v("np-mail").trim()
      });
      Modal.close(); render();
      toast("good", "Demande transmise", p.id + " — en attente de validation par l'administration.");
    } catch (e) {
      toast("bad", "Transmission impossible", (e.body && e.body.message) || "Erreur");
    }
  }

  function exportCSV() {
    const p = mypartner();
    const since = Date.now() - period * 864e5;
    const rows = DB.txns.filter(t => t.partnerId === p.id && t.at >= since);
    const csv = ["reference;date;salarie;montant_eur;canal;empreinte"].concat(rows.map(t =>
      [t.ref, new Date(t.at).toISOString(), (emp(t.employeeId) || {}).name || "",
       (t.amount / 100).toFixed(2).replace(".", ","), t.channel, t.hash].join(";"))).join("\n");
    Modal.open("Export des transactions (" + rows.length + " lignes)",
      '<p style="font-size:13px;color:var(--ink-3);margin-bottom:10px">Format CSV, séparateur point-virgule.</p>'
      + '<textarea class="input mono" id="csv-out" rows="10" readonly style="font-size:11.5px">'
      + esc(csv) + "</textarea>",
      '<button class="btn" type="button" data-close>Fermer</button>'
      + '<button class="btn btn--primary" type="button" data-copy="csv-out">Copier</button>');
  }

  async function render() {
    const body = view === "bord" ? await bord()
      : view === "encaisser" ? encaisser()
      : view === "transactions" ? await transactions()
      : view === "catalogue" ? await catalogue()
      : await compte();
    $("#app").innerHTML = '<div class="workspace">' + rail() + '<div class="stage">' + body + "</div></div>";
    mountCharts();
    if (scrollY > 120) scrollTo({ top: 0 });

    const amt = $("#pay-amount");
    if (amt) { amt.oninput = () => { scan.amount = amt.value; }; if (scan.token) amt.focus(); }
    const q = $("#pcat-q");
    if (q) q.oninput = () => { cat.query = q.value; cat.page = 1; clearTimeout(q._t);
      q._t = setTimeout(() => render().then(() => { const n = $("#pcat-q"); if (n) { n.focus(); n.selectionStart = n.value.length; } }), 220); };
  }

  BUS.on("txn", d => { if (DB.session.role === "partner" && d.partner.id === DB.session.partnerId) render(); });

  return {
    render,
    go(v) { view = v; render(); },
    reset() { view = "bord"; scan = { token: null, employee: null, amount: "" }; },
    handle(el) {
      if (el.dataset.pview) { view = el.dataset.pview; render(); return true; }
      if (el.dataset.scan === "cam") { doScan(); return true; }
      if (el.dataset.scan === "man") {
        Modal.open("Saisie manuelle du jeton",
          '<label class="field"><span class="field__lb">Jeton présenté par le salarié</span>'
          + '<input class="input mono" id="man-token" placeholder="CP1|a1b2c3d4e5f6a7b8">'
          + '<span class="field__hint">Le jeton figure sous le QR code, dans l\'application du salarié.</span></label>',
          '<button class="btn" type="button" data-close>Annuler</button>'
          + '<button class="btn btn--primary" type="button" data-man="1">Valider le jeton</button>');
        return true;
      }
      if (el.dataset.man) {
        const raw = (($("#man-token") || {}).value || "").trim().replace(/^CP1\|/, "");
        Modal.close();
        if (raw) resolve(raw); else toast("bad", "Jeton vide", "Recopiez le jeton affiché sous le QR code.");
        return true;
      }
      if (el.dataset.scan === "validate") { validate(); return true; }
      if (el.dataset.scan === "cancel") { scan = { token: null, employee: null, amount: "" }; render(); return true; }
      if (el.dataset.sync) { sync(); return true; }
      if (el.dataset.period) { period = Number(el.dataset.period); cat.page = 1; render(); return true; }
      if (el.dataset.export) { exportCSV(); return true; }
      if (el.dataset.newPartner) { newPartnerForm(); return true; }
      if (el.dataset.submitPartner) { submitPartner(); return true; }
      if (el.dataset.pager === "ptx" || el.dataset.pager === "pcat") {
        cat.page = Number(el.dataset.page); render(); return true;
      }
      return false;
    }
  };
})();
</script>

<script>
"use strict";
/* ============================================================================
   8. Espace administration (Ministère)
   ========================================================================= */

const Admin = (function () {

  let view = "bord";
  let page = { comptes: 1, rech: 1 };
  let tableView = false;

  const NAV = [
    ["bord",        "chart",  "Tableau de bord national"],
    ["validations", "shield", "Validations"],
    ["comptes",     "users",  "Comptes"],
    ["recharges",   "wallet", "Rechargements employeurs"],
    ["registre",    "lock",   "Registre des transactions"],
    ["api",         "key",    "API & interopérabilité"]
  ];

  function rail() {
    const pend = DB.partners.filter(p => p.status === "pending").length;
    return '<aside class="rail"><div class="rail__group">'
      + '<p class="rail__label">Administration</p>'
      + NAV.map(([id, i, lb]) =>
          '<button class="navitem" type="button" data-aview="' + id + '"'
          + (view === id ? ' aria-current="true"' : "") + ">"
          + '<span class="navitem__ico">' + ico(i) + "</span>" + lb
          + (id === "validations" && pend ? '<span class="navitem__badge">' + pend + "</span>" : "")
          + "</button>").join("")
      + "</div></aside>";
  }

  /* ---- Tableau de bord national ----------------------------------------- */
  async function bord() {
    const s = await API.get("/admin/stats");
    const now = Date.now();

    const weeks = [];
    for (let i = 11; i >= 0; i--) {
      const end = now - i * 7 * 864e5, start = end - 7 * 864e5;
      const rows = DB.txns.filter(t => t.at >= start && t.at < end);
      const d = new Date(start);
      weeks.push({ label: "Semaine du " + dateFR(start), value: rows.reduce((a, t) => a + t.amount, 0),
                   count: rows.length, tick: i % 2 === 0 ? d.getDate() + "/" + (d.getMonth() + 1) : "" });
    }
    const regions = Object.entries(s.byRegion).sort((a, b) => b[1] - a[1])
      .map(([label, value]) => ({ label, value }));
    const cats = Object.entries(s.byCategory).sort((a, b) => b[1] - a[1])
      .map(([id, value]) => ({ label: catLabel(id), value }));
    const evol = s.volume30prev ? Math.round((s.volume30 - s.volume30prev) / s.volume30prev * 100) : 0;

    const recent = DB.txns.slice(-14).reverse().map(t => {
      const p = prt(t.partnerId);
      return '<span class="ticker__i"><span class="dot"></span>'
        + '<span class="mono" style="color:var(--ink-4)">' + esc(t.ref) + "</span>"
        + esc(p ? p.name : "—") + '<span class="amt">' + eur(t.amount) + "</span>"
        + '<span style="color:var(--ink-4)">' + esc(p ? p.city : "") + "</span></span>";
    }).join("");

    return '<div class="pagehead"><div><h1>Tableau de bord national</h1>'
      + "<p>Volumétrie du dispositif CartePro, tous employeurs et tous partenaires confondus.</p></div>"
      + '<div class="pagehead__act"><span class="pill pill--info">' + ico("refresh")
      + "Données au " + dateFR(Date.now(), true) + "</span></div></div>"

      + '<div class="grid g-main" style="margin-bottom:16px">'
      + '<section class="card"><div class="card__bd" style="display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap">'
      +   "<div><div class=\"stat__lb\">Volume échangé depuis l'ouverture</div>"
      +     '<div class="hero-fig">' + eur(s.volume, { maximumFractionDigits: 0 }) + "</div>"
      +     '<div class="stat__d stat__d--' + (evol >= 0 ? "up" : "down") + '">'
      +       ico(evol >= 0 ? "up" : "down") + "<b>" + (evol >= 0 ? "+" : "") + evol
      +       " %</b> sur 30 jours glissants</div></div>"
      +   '<div style="flex:1;min-width:220px">' + sparkline(weeks.map(w => w.value / 100)) + "</div>"
      + "</div></section>"
      + statTile("Transactions", nfr(s.count), { note: nfr(s.count30) + " sur 30 jours" })
      + "</div>"

      + '<div class="grid g-4" style="margin-bottom:16px">'
      + statTile("Partenaires actifs", nfr(s.partnersActive), {
          note: s.partnersPending ? s.partnersPending + " demande(s) en attente" : "Aucune demande en attente" })
      + statTile("Salariés bénéficiaires", nfr(s.employees), { note: DB.employers.length + " employeurs raccordés" })
      + statTile("Encours non dépensé", eur(s.outstanding), { note: "Solde cumulé des bénéficiaires" })
      + statTile("Panier moyen", eur(s.average), { note: "Toutes transactions" })
      + "</div>"

      + '<div class="ticker" tabindex="0" aria-label="Dernières transactions enregistrées">'
      +   '<span class="ticker__lb">Flux des encaissements</span>'
      +   '<div class="ticker__win"><div class="ticker__track">' + recent + recent + "</div></div></div>"

      + '<div class="grid g-main" style="margin-top:16px">'
      + '<section class="card"><div class="card__hd"><h3>Volume hebdomadaire</h3>'
      +   '<span class="sub">12 dernières semaines</span>'
      +   '<span class="act"><button class="btn btn--ghost" type="button" data-tableview="1">'
      +     (tableView ? "Voir le graphique" : "Voir les données") + "</button></span></div>"
      +   '<div class="card__bd">'
      +   (tableView
          ? '<div class="tblwrap"><table class="tbl"><thead><tr><th>Semaine</th>'
            + '<th class="r">Transactions</th><th class="r">Volume</th></tr></thead><tbody>'
            + weeks.map(w => "<tr><td>" + esc(w.label) + '</td><td class="r num">' + w.count
              + '</td><td class="r num">' + eur(w.value) + "</td></tr>").join("")
            + "</tbody></table></div>"
          : chartBox(weeks, { px: 220, aria: "Volume hebdomadaire des transactions",
              fmtTick: v => eurShort(v), fmtPeak: r => eurShort(r.value),
              tip: r => r.label + "\n" + eur(r.value) + " · " + r.count + " transactions" }))
      +   "</div></section>"
      + '<section class="card"><div class="card__hd"><h3>Répartition géographique</h3>'
      +   '<span class="sub">volume par région</span></div>'
      +   '<div class="card__bd">' + barChart(regions, { fmt: eurShort }) + "</div>"
      +   '<div class="card__ft">' + regions.length + " régions actives sur " + REGIONS.length + "</div></section>"
      + "</div>"

      + '<section class="card" style="margin-top:16px"><div class="card__hd">'
      +   "<h3>Répartition par catégorie de partenaire</h3></div>"
      +   '<div class="card__bd">' + barChart(cats, { fmt: eurShort }) + "</div></section>";
  }

  /* ---- Validations ------------------------------------------------------ */
  async function validations() {
    const pend = await API.get("/partners", { status: "pending", all: 1, size: 50 });
    const hist = DB.audit.slice(0, 8);

    return '<div class="pagehead"><div><h1>Validations d\'adhésion</h1>'
      + "<p>Toute demande d'adhésion est instruite manuellement avant activation (§2.2). "
      + "Un établissement non validé ne peut encaisser aucune transaction.</p></div></div>"
      + (pend.items.length
        ? '<div class="grid g-2">' + pend.items.map(p => {
            const full = prt(p.id);
            return '<section class="card"><div class="card__hd">'
              + '<span class="pitem__ico">' + ico(catIco(p.category)) + "</span>"
              + "<div><h3>" + esc(p.name) + "</h3>"
              + '<span class="sub">' + esc(p.categoryLabel) + " · " + esc(p.city) + "</span></div>"
              + '<span class="act"><span class="pill pill--warn">En attente</span></span></div>'
              + '<div class="card__bd" style="font-size:13px;display:flex;flex-direction:column;gap:6px">'
              + '<div><span style="color:var(--ink-3)">Adresse </span>' + esc(full.address || "—") + ", " + esc(p.city) + "</div>"
              + '<div><span style="color:var(--ink-3)">SIRET </span><span class="mono">' + esc(full.siret || "—") + "</span></div>"
              + '<div><span style="color:var(--ink-3)">Contact </span>' + esc(full.contact || "—") + "</div>"
              + '<div><span style="color:var(--ink-3)">Déposée le </span>' + dateFR(full.createdAt, true) + "</div>"
              + "</div>"
              + '<div class="card__ft" style="display:flex;gap:8px">'
              + '<button class="btn btn--primary" type="button" data-validate="' + p.id + '">'
              + ico("check") + "Valider l'adhésion</button>"
              + '<button class="btn" type="button" data-reject="' + p.id + '">Refuser</button></div></section>';
          }).join("") + "</div>"
        : '<section class="card"><p class="empty">' + ico("check")
          + "<br>Aucune demande en attente d'instruction.</p></section>")
      + '<section class="card" style="margin-top:16px"><div class="card__hd"><h3>Décisions récentes</h3></div>'
      + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Établissement</th>'
      + "<th>Décision</th><th>Agent</th></tr></thead><tbody>"
      + (hist.length ? hist.map(a => "<tr><td class=\"num\">" + dateFR(a.at, true) + "</td>"
          + "<td>" + esc((prt(a.target) || {}).name || a.target) + "</td>"
          + '<td><span class="pill ' + STATUS[a.to].pill + '">' + STATUS[a.to].label + "</span></td>"
          + '<td style="color:var(--ink-3)">' + esc(a.actor) + "</td></tr>").join("")
        : '<tr><td colspan="4"><p class="empty">Aucune décision enregistrée</p></td></tr>')
      + "</tbody></table></div></section>";
  }

  /* ---- Comptes ---------------------------------------------------------- */
  async function comptes() {
    const res = await API.get("/partners", { all: 1, size: 8, page: page.comptes });
    return '<div class="pagehead"><div><h1>Gestion des comptes</h1>'
      + "<p>Activation, suspension et clôture des comptes partenaires ; suivi des soldes salariés.</p></div></div>"
      + '<section class="card"><div class="card__hd"><h3>Partenaires</h3>'
      + '<span class="sub">' + res.total + " comptes</span></div>"
      + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Établissement</th><th>Catégorie</th>'
      + "<th>Région</th><th>Statut</th><th>Actions</th></tr></thead><tbody>"
      + res.items.map(p => {
          const acts = [];
          if (p.status !== "active") acts.push(['<button class="btn" type="button" data-status="active" data-id="' + p.id + '">Activer</button>']);
          if (p.status === "active") acts.push(['<button class="btn" type="button" data-status="suspended" data-id="' + p.id + '">Suspendre</button>']);
          if (p.status !== "closed") acts.push(['<button class="btn btn--ghost" type="button" data-status="closed" data-id="' + p.id + '">Clôturer</button>']);
          return "<tr><td><b>" + esc(p.name) + '</b><div style="font-size:11.5px;color:var(--ink-4)" class="mono">'
            + esc(p.id) + "</div></td><td>" + esc(p.categoryLabel) + "</td>"
            + '<td style="color:var(--ink-3)">' + esc(p.region) + "</td>"
            + '<td><span class="pill ' + STATUS[p.status].pill + '">' + STATUS[p.status].label + "</span></td>"
            + '<td><div style="display:flex;gap:6px">' + acts.join("") + "</div></td></tr>";
        }).join("")
      + "</tbody></table></div>"
      + '<div class="card__ft"><div class="pager">' + pagerHTML(res, "comptes") + "</div></div></section>"

      + '<section class="card" style="margin-top:16px"><div class="card__hd"><h3>Salariés bénéficiaires</h3></div>'
      + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Salarié</th><th>Employeur</th>'
      + '<th class="r">Solde</th><th class="r">Dépensé</th><th>Bénéficiaire depuis</th></tr></thead><tbody>'
      + DB.employees.map(e => {
          const spent = DB.txns.filter(t => t.employeeId === e.id).reduce((s, t) => s + t.amount, 0);
          return "<tr><td><b>" + esc(e.name) + '</b><div style="font-size:11.5px;color:var(--ink-4)">'
            + esc(e.email) + "</div></td><td>" + esc(emr(e.employerId).name) + "</td>"
            + '<td class="r num"><b>' + eur(e.balance) + '</b></td><td class="r num">' + eur(spent) + "</td>"
            + '<td style="color:var(--ink-3)">' + esc(e.since) + "</td></tr>";
        }).join("")
      + "</tbody></table></div></section>";
  }

  /* ---- Rechargements ---------------------------------------------------- */
  async function recharges() {
    const rows = DB.topups.slice(0, 10);
    return '<div class="pagehead"><div><h1>Rechargements employeurs</h1>'
      + "<p>Créditer les comptes salariés au nom d'un employeur raccordé au dispositif.</p></div></div>"
      + '<div class="grid g-main">'
      + '<section class="card"><div class="card__hd"><h3>Nouveau rechargement</h3></div>'
      +   '<div class="card__bd">'
      +   '<label class="field"><span class="field__lb">Employeur</span>'
      +     '<select class="select" id="tp-employer">'
      +     DB.employers.map(e => '<option value="' + e.id + '">' + esc(e.name) + " — " + e.employees
          + " salariés</option>").join("") + "</select></label>"
      +   '<label class="field"><span class="field__lb">Montant par salarié</span>'
      +     '<input class="input input--big num" id="tp-amount" inputmode="decimal" value="180,00">'
      +     '<span class="field__hint">Le même montant est crédité à chaque bénéficiaire sélectionné.</span></label>'
      +   '<label class="field"><span class="field__lb">Libellé</span>'
      +     '<input class="input" id="tp-label" value="Dotation mensuelle"></label>'
      +   '<span class="field__lb">Bénéficiaires</span>'
      +   '<div id="tp-list" style="max-height:190px;overflow:auto;border:1px solid var(--line);'
      +     'border-radius:var(--r-ctl);padding:8px 10px;margin-bottom:14px"></div>'
      +   '<button class="btn btn--primary btn--lg" type="button" data-topup="1">'
      +     ico("wallet") + "Créditer les comptes</button>"
      +   "</div></section>"
      + '<section class="card"><div class="card__hd"><h3>Derniers rechargements</h3></div>'
      +   '<div class="tblwrap"><table class="tbl"><thead><tr><th>Réf.</th><th>Salarié</th>'
      +   '<th class="r">Montant</th><th>Date</th></tr></thead><tbody>'
      +   rows.map(t => "<tr><td class=\"mono\">" + esc(t.id) + "</td><td>"
        + esc((emp(t.employeeId) || {}).name || "—") + '</td><td class="r num">+' + eur(t.amount)
        + '</td><td class="num" style="color:var(--ink-3)">' + dateFR(t.at) + "</td></tr>").join("")
      +   "</tbody></table></div></section></div>";
  }

  function fillTopupList() {
    const box = $("#tp-list"), sel = $("#tp-employer");
    if (!box || !sel) return;
    box.innerHTML = DB.employees.filter(e => e.employerId === sel.value).map(e =>
      '<label style="display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13px">'
      + '<input type="checkbox" class="tp-emp" value="' + e.id + '" checked>'
      + esc(e.name) + '<span style="margin-left:auto;color:var(--ink-4)" class="num">' + eur(e.balance) + "</span></label>"
    ).join("");
  }

  async function doTopup() {
    const amount = Math.round(parseFloat(($("#tp-amount").value || "").replace(/\s/g, "").replace(",", ".")) * 100);
    const ids = $$(".tp-emp:checked").map(c => c.value);
    if (!(amount > 0)) { toast("bad", "Montant invalide", "Saisissez un montant supérieur à zéro."); return; }
    if (!ids.length) { toast("bad", "Aucun bénéficiaire", "Sélectionnez au moins un salarié."); return; }
    try {
      const r = await API.post("/topups", { employerId: $("#tp-employer").value, amount,
        employeeIds: ids, label: $("#tp-label").value });
      render();
      toast("good", "Comptes crédités", r.credited + " salariés · " + eur(r.total) + " au total.");
    } catch (e) {
      toast("bad", "Rechargement refusé", (e.body && e.body.message) || "Erreur");
    }
  }

  /* ---- Registre --------------------------------------------------------- */
  async function registre() {
    const v = await API.get("/ledger/verify");
    const last = DB.txns.slice(-12).reverse();
    return '<div class="pagehead"><div><h1>Registre des transactions</h1>'
      + "<p>Chaque transaction porte l'empreinte de la précédente. Modifier une ligne écrite romprait "
      + "la chaîne et serait immédiatement détectable (§3.2).</p></div></div>"
      + '<div class="grid g-3" style="margin-bottom:16px">'
      + statTile("Écritures au registre", nfr(v.count || DB.txns.length))
      + statTile("État de la chaîne", v.ok ? "Intègre" : "Rompue",
          { note: v.ok ? "Vérifiée à l'instant" : "Rupture à l'écriture " + v.ref })
      + statTile("Empreinte de tête", (v.head || "—"), { note: "Dernier maillon de la chaîne" })
      + "</div>"
      + '<section class="card"><div class="card__hd"><h3>Contrôle d\'inaltérabilité</h3>'
      + '<span class="act"><button class="btn" type="button" data-verify="1">' + ico("shield")
      + "Vérifier la chaîne</button>"
      + '<button class="btn" type="button" data-tamper="1">Simuler une falsification</button></span></div>'
      + '<div class="card__bd"><div id="verify-out" class="note">' + ico("info")
      + "<div>La vérification recalcule l'empreinte de chaque écriture à partir de la précédente et "
      + "la compare à celle qui est stockée. La falsification simulée modifie un montant en mémoire, "
      + "montre la rupture détectée, puis restaure immédiatement la valeur d'origine.</div></div></div></section>"
      + '<section class="card" style="margin-top:16px"><div class="card__hd"><h3>Dernières écritures</h3></div>'
      + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Réf.</th><th>Date</th><th>Salarié</th>'
      + '<th>Partenaire</th><th class="r">Montant</th><th>Empreinte précédente</th><th>Empreinte</th>'
      + "</tr></thead><tbody>"
      + last.map(t => "<tr><td class=\"mono\">" + esc(t.ref) + '</td><td class="num">' + dateFR(t.at, true)
        + "</td><td>" + esc((emp(t.employeeId) || {}).name || "—") + "</td><td>"
        + esc((prt(t.partnerId) || {}).name || "—") + '</td><td class="r num">' + eur(t.amount)
        + '</td><td class="mono" style="color:var(--ink-4)">' + esc(t.prev) + '</td>'
        + '<td class="mono">' + esc(t.hash) + "</td></tr>").join("")
      + "</tbody></table></div></section>";
  }

  async function verify(msg) {
    const v = await API.get("/ledger/verify");
    const out = $("#verify-out");
    if (!out) return v;
    out.className = "note" + (v.ok ? "" : " note--warn");
    out.innerHTML = ico(v.ok ? "check" : "alert") + "<div><b>"
      + (v.ok ? "Chaîne intègre." : "Rupture détectée à l'écriture " + esc(v.ref) + ".")
      + "</b> " + (v.ok
        ? nfr(v.count) + " écritures vérifiées, empreinte de tête " + v.head + "."
        : "Empreinte attendue " + esc(v.expected) + ", empreinte stockée " + esc(v.found) + ".")
      + (msg ? " " + esc(msg) : "") + "</div>";
    return v;
  }

  async function tamper() {
    const i = Math.max(0, DB.txns.length - 5);
    const t = DB.txns[i], keep = t.amount;
    t.amount = keep + 1337;
    await verify("La ligne " + t.ref + " a été modifiée hors procédure.");
    setTimeout(async () => {
      t.amount = keep;
      await verify("Valeur d'origine restaurée : le registre est de nouveau cohérent.");
      toast("info", "Démonstration terminée", "Le montant modifié a été restauré.");
    }, 2600);
  }

  /* ---- API -------------------------------------------------------------- */
  function apiView() {
    return '<div class="pagehead"><div><h1>API & interopérabilité</h1>'
      + "<p>Interface REST documentée, échanges en JSON (§3.3). Le point d'entrée « solde » est celui "
      + "prévu pour l'interconnexion future avec les SIRH employeurs.</p></div>"
      + '<div class="pagehead__act"><button class="btn" type="button" data-console="1">'
      + ico("eye") + "Ouvrir la console</button></div></div>"
      + '<section class="card"><div class="card__hd"><h3>Points d\'entrée</h3>'
      + '<span class="sub">base <span class="mono">/api/v1</span></span></div>'
      + '<div class="tblwrap"><table class="tbl"><thead><tr><th>Méthode</th><th>Chemin</th>'
      + "<th>Rôle</th><th></th></tr></thead><tbody>"
      + API.doc.map(([m, p, d]) => "<tr><td><b class=\"mono\">" + m + '</b></td><td class="mono">'
        + esc(p) + '</td><td style="color:var(--ink-3)">' + esc(d) + "</td>"
        + '<td class="r">' + (p.indexOf("{") < 0 && m === "GET"
          ? '<button class="btn btn--ghost" type="button" data-try="' + esc(p) + '">Tester</button>'
          : "") + "</td></tr>").join("")
      + "</tbody></table></div></section>"
      + '<div class="grid g-2" style="margin-top:16px">'
      + '<section class="card"><div class="card__hd"><h3>Exemple — solde d\'un salarié</h3></div>'
      +   '<div class="card__bd"><pre class="mono" style="margin:0;font-size:12px;overflow-x:auto;'
      +   'background:var(--surface-2);padding:12px;border-radius:var(--r-ctl);border:1px solid var(--line)">'
      +   esc('GET /api/v1/employees/SAL-0042/balance\n\n200 OK\n{\n  "employeeId": "SAL-0042",\n'
          + '  "balance": 24760,\n  "currency": "EUR",\n  "asOf": "2026-08-31T09:12:44.108Z"\n}')
      +   "</pre>"
      +   '<div class="note" style="margin-top:14px">' + ico("info")
      +   "<div>Les montants circulent en centimes, en nombre entier : aucun arrondi flottant ne peut "
      +   "s'introduire dans une somme d'argent.</div></div></div></section>"
      + '<section class="card"><div class="card__hd"><h3>Sécurité des échanges</h3></div>'
      +   '<div class="card__bd" style="display:flex;flex-direction:column;gap:12px">'
      +   [["HTTPS obligatoire", "Aucun échange en clair ; en production, HSTS et certificat de l'État."],
          ["Jeton à usage unique", "Cinq minutes de validité, invalidé dès le premier encaissement."],
          ["Écriture définitive", "Aucune route ne permet de modifier ou supprimer une transaction."],
          ["Authentification par rôle", "Salarié, partenaire et administration ont des périmètres disjoints."]
        ].map(s => '<div style="display:flex;gap:11px"><span style="color:var(--good);flex:none">'
          + ico("check") + "</span><div><b style=\"font-size:13px\">" + s[0] + "</b>"
          + '<div style="font-size:12.5px;color:var(--ink-3)">' + s[1] + "</div></div></div>").join("")
      +   "</div></section></div>";
  }

  /* ---- Assemblage ------------------------------------------------------- */
  async function render() {
    const body = view === "bord" ? await bord()
      : view === "validations" ? await validations()
      : view === "comptes" ? await comptes()
      : view === "recharges" ? await recharges()
      : view === "registre" ? await registre()
      : apiView();
    $("#app").innerHTML = '<div class="workspace">' + rail() + '<div class="stage">' + body + "</div></div>";
    mountCharts();
    if (scrollY > 120) scrollTo({ top: 0 });
    if (view === "recharges") {
      fillTopupList();
      const sel = $("#tp-employer");
      if (sel) sel.onchange = fillTopupList;
    }
  }

  async function setStatus(id, status) {
    try {
      const p = await API.patch("/partners/" + id, { status });
      render();
      toast(status === "active" ? "good" : "info", "Statut mis à jour",
        p.name + " — " + STATUS[status].label.toLowerCase() + ".");
    } catch (e) {
      toast("bad", "Modification refusée", (e.body && e.body.message) || "Erreur");
    }
  }

  BUS.on("txn", () => { if (DB.session.role === "admin" && view === "bord") render(); });

  return {
    render,
    go(v) { view = v; render(); },
    reset() { view = "bord"; },
    handle(el) {
      if (el.dataset.aview) { view = el.dataset.aview; render(); return true; }
      if (el.dataset.validate) { setStatus(el.dataset.validate, "active"); return true; }
      if (el.dataset.reject) { setStatus(el.dataset.reject, "rejected"); return true; }
      if (el.dataset.status && el.dataset.id) { setStatus(el.dataset.id, el.dataset.status); return true; }
      if (el.dataset.pager === "comptes") { page.comptes = Number(el.dataset.page); render(); return true; }
      if (el.dataset.tableview) { tableView = !tableView; render(); return true; }
      if (el.dataset.topup) { doTopup(); return true; }
      if (el.dataset.verify) { verify(); return true; }
      if (el.dataset.tamper) { tamper(); return true; }
      if (el.dataset.try) { API.get(el.dataset.try).then(() => Shell.openConsole()); return true; }
      if (el.dataset.console) { Shell.openConsole(); return true; }
      return false;
    }
  };
})();
</script>

<script>
"use strict";
/* ============================================================================
   9. Coquille applicative : session, rôles, console, amorçage
   ========================================================================= */

const Shell = (function () {

  const ROLES = {
    employee: { label: "Salarié",        who: () => me().name,          sub: "Bénéficiaire CartePro" },
    partner:  { label: "Partenaire",     who: () => mypartner().name,   sub: "Établissement référencé" },
    admin:    { label: "Administration", who: () => "Thomas Vignal",    sub: "Direction du Numérique" }
  };

  function login() {
    const cards = [
      ["employee", "wallet", "Espace salarié",
       "Consulter son solde, générer un QR code de paiement, retrouver ses opérations et localiser les partenaires.",
       "Amina Berthier · Groupe Vallonis"],
      ["partner", "store", "Espace partenaire",
       "Encaisser un paiement CartePro, suivre ses recettes, gérer son compte et parcourir le catalogue.",
       "Le Comptoir des Halles · Paris"],
      ["admin", "shield", "Espace administration",
       "Instruire les adhésions, piloter les comptes, créditer les salariés et suivre la volumétrie nationale.",
       "Direction du Numérique et de l'Innovation"]
    ];
    return '<div class="login"><div class="login__box">'
      + '<div class="login__head"><h1>Dispositif CartePro</h1>'
      + "<p>Démonstrateur fonctionnel du titre dématérialisé d'avantages salariés. "
      + "Trois espaces, un même registre de transactions.</p></div>"
      + '<div class="rolecards">' + cards.map(([id, i, t, d, who]) =>
          '<button class="rolecard" type="button" data-login="' + id + '">'
          + '<span class="rolecard__ico">' + ico(i) + "</span>"
          + "<h3>" + t + "</h3><p>" + d + "</p>"
          + '<span class="rolecard__who">' + esc(who) + "</span></button>").join("")
      + "</div>"
      + '<div class="note" style="margin-top:22px">' + ico("info")
      + "<div><b>Simulation fonctionnelle.</b> Aucune opération financière réelle n'est effectuée "
      + "(§5 du cahier des charges JEB/DNI/2026-002). Les données sont fictives et stockées dans "
      + "ce navigateur uniquement.</div></div>"
      + "</div></div>";
  }

  function whoami() {
    const r = DB.session.role;
    if (!r) { $("#whoami").innerHTML = ""; return; }
    const initials = ROLES[r].who().split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
    $("#whoami").innerHTML = '<div class="whoami"><div class="whoami__av">' + esc(initials) + "</div>"
      + '<div><div class="whoami__n">' + esc(ROLES[r].who()) + "</div>"
      + '<div class="whoami__r">' + esc(ROLES[r].sub) + "</div></div>"
      + '<button class="btn btn--ghost" type="button" data-logout="1" aria-label="Fermer la session" '
      + 'title="Fermer la session">' + ico("out") + "</button></div>";
  }

  function roleswitch() {
    $("#roleswitch").innerHTML = Object.keys(ROLES).map(r =>
      '<button class="rolebtn" type="button" data-role="' + r + '"'
      + (DB.session.role === r ? ' aria-current="true"' : "") + ">" + ROLES[r].label + "</button>").join("");
  }

  async function setRole(role) {
    await API.post("/auth/session", { role });
    save();
    render();
  }

  function render() {
    roleswitch(); whoami();
    const r = DB.session.role;
    if (!r) { $("#app").innerHTML = login(); return; }
    if (r === "employee") Employee.render();
    else if (r === "partner") Partner.render();
    else Admin.render();
  }

  /* ---- Console API ------------------------------------------------------ */
  function logLine(e) {
    const body = JSON.stringify(e.body);
    const short = body.length > 260 ? body.slice(0, 260) + " …" : body;
    return '<div class="logline"><span class="logline__m" data-m="' + e.method + '">' + e.method + "</span>"
      + '<span class="logline__p">' + esc(e.path) + "</span>"
      + '<span class="logline__s"><b' + (e.bad ? ' data-bad="1"' : "") + ">"
      + (e.status || "ERR") + "</b> · " + e.ms + " ms</span></div>"
      + '<div class="logbody">' + esc(short) + "</div>";
  }
  function paintLog() {
    const box = $("#console-log");
    box.innerHTML = API.logs.slice(-60).reverse().map(logLine).join("")
      || '<p style="color:#8b92ad">Aucun appel pour l\'instant. Chaque geste dans l\'interface en déclenche un.</p>';
    $("#console-count").textContent = String(API.logs.length);
  }
  function openConsole() {
    $("#console").dataset.open = "true";
    $("#btn-console").setAttribute("aria-pressed", "true");
    paintLog();
  }
  function closeConsole() {
    $("#console").dataset.open = "false";
    $("#btn-console").setAttribute("aria-pressed", "false");
  }

  /* ---- Délégation globale des clics ------------------------------------- */
  document.addEventListener("click", ev => {
    const el = ev.target.closest ? ev.target.closest("[data-login],[data-role],[data-logout],[data-copy],"
      + "[data-eview],[data-qr],[data-month],[data-cat],[data-pager],[data-partner],"
      + "[data-pview],[data-scan],[data-man],[data-sync],[data-period],[data-export],"
      + "[data-new-partner],[data-submit-partner],[data-aview],[data-validate],[data-reject],"
      + "[data-status],[data-tableview],[data-topup],[data-verify],[data-tamper],[data-try],[data-console]") : null;
    if (!el) return;

    if (el.dataset.login) { setRole(el.dataset.login); return; }
    if (el.dataset.role)  { setRole(el.dataset.role); return; }
    if (el.dataset.logout) {
      DB.session.role = null; save();
      Employee.reset(); Partner.reset(); Admin.reset();
      render(); return;
    }
    if (el.dataset.copy) {
      const src = $("#" + el.dataset.copy);
      if (src) {
        src.select();
        try { document.execCommand("copy"); toast("good", "Copié", "Le contenu est dans le presse-papiers."); }
        catch (e) { toast("info", "Sélection prête", "Utilisez Ctrl+C pour copier."); }
      }
      return;
    }
    const role = DB.session.role;
    if (role === "employee" && Employee.handle(el)) return;
    if (role === "partner" && Partner.handle(el)) return;
    if (role === "admin" && Admin.handle(el)) return;
    // Certains gestes valent quel que soit l'espace ouvert.
    if (Employee.handle(el) || Partner.handle(el) || Admin.handle(el)) return;
  });

  /* ---- Barre de pilotage ------------------------------------------------ */
  function wireDock() {
    $("#btn-degraded").onclick = () => {
      DB.degraded = !DB.degraded; save();
      $("#btn-degraded").setAttribute("aria-pressed", String(DB.degraded));
      toast(DB.degraded ? "info" : "good",
        DB.degraded ? "Mode dégradé activé" : "Réseau rétabli",
        DB.degraded
          ? "Les appels serveur échouent ; le QR et les encaissements passent en local."
          : "Les encaissements en attente peuvent être synchronisés.");
      render();
    };
    $("#btn-console").onclick = () =>
      ($("#console").dataset.open === "true" ? closeConsole() : openConsole());
    $("#console-close").onclick = closeConsole;
    $("#console-clear").onclick = () => { API.clear(); paintLog(); };
    $("#console-doc").onclick = () => Modal.open("Points d'entrée de l'API",
      '<div class="tblwrap"><table class="tbl"><thead><tr><th>Méthode</th><th>Chemin</th><th>Rôle</th>'
      + "</tr></thead><tbody>" + API.doc.map(([m, p, d]) =>
          '<tr><td class="mono"><b>' + m + '</b></td><td class="mono">' + esc(p)
          + '</td><td style="color:var(--ink-3)">' + esc(d) + "</td></tr>").join("")
      + "</tbody></table></div>",
      '<button class="btn" type="button" data-close>Fermer</button>');
    $("#btn-reset").onclick = () => {
      if (!confirm("Réinitialiser toutes les données de démonstration ?")) return;
      resetDB();
      Employee.reset(); Partner.reset(); Admin.reset();
      API.clear();
      render();
      toast("good", "Données réinitialisées", "Le jeu de démonstration est revenu à son état initial.");
    };
    API.onLog(() => { if ($("#console").dataset.open === "true") paintLog();
      else $("#console-count").textContent = String(API.logs.length); });
  }

  /* ---- Amorçage --------------------------------------------------------- */
  function boot() {
    DB = load() || seed();
    if (!DB.outbox) DB.outbox = [];
    if (!DB.audit) DB.audit = [];
    save();
    $("#btn-degraded").setAttribute("aria-pressed", String(!!DB.degraded));
    wireDock();
    render();
  }

  return { boot, render, openConsole };
})();

Shell.boot();
</script>
